# Configuração do pytest do backend (F0, passo 0.5).
# Rodar a partir de backend/:  python -m pytest
# CI (job "test" do deploy.yml):  python -m pytest -m "not slow and not gpu and not llm_live"
[pytest]
testpaths = tests
# Garante que o pacote "app" seja importável a partir de backend/, rodando com
# "pytest" ou "python -m pytest", em qualquer sistema operacional.
pythonpath = .
addopts = -ra --strict-markers
markers =
    slow: teste demorado (treino, avaliação completa, GA longo); fora do job padrão do CI
    gpu: exige GPU com CUDA (fine-tuning, smoke de QLoRA); nunca roda no CI
    llm_live: chama um LLM real (Gemini, healthai-llm, llama-server); nunca roda no CI
    integration: exige serviço externo local (Postgres com pgvector via DATABASE_URL de teste)
