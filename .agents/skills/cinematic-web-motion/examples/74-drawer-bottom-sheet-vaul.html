<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>74 · Drawer Bottom Sheet (Vaul)</title>
<!--
PATTERN: A bottom sheet dragged by its handle with snap points; the page behind scales down and
  rounds its corners as the sheet rises (ref: Vaul by Emil Kowalski).
Motion: Pointer drag sets translateY directly (no transition while dragging). On release, velocity
  and position pick the nearest snap (peek / half / full) or dismiss when dragged far/fast down.
  Page scale = 1 - 0.06 * progress, linked to the sheet position. Easing cubic-bezier(.2,.7,.2,1).
Accessibility: role=dialog aria-modal, focus moves into the sheet and returns on close; Escape closes;
  Tab is trapped in the sheet; handle is a button with ArrowUp/ArrowDown to change snap (keyboard
  alternative to dragging). Snap is also shown as text ("Peek", "Half", "Full").
  prefers-reduced-motion: snaps instantly, no page scale.
Adapting: SNAPS (fraction of sheet visible), VELOCITY, SCALE in CONFIG. Libraries: none.
-->
<style>
:root{--bg:#1b1713;--page:#f0eadc;--fg:#1f1b16;--mut:#5a5246;--sheet:#fbf8f0;--acc:#b5421f;--line:#cbc1ac;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);min-height:100vh;overflow-x:hidden}
#page{background:var(--page);color:var(--fg);font-family:"Segoe UI",Helvetica,sans-serif;min-height:100vh;padding:10vh 7vw;transform-origin:50% 0;transition:transform .45s var(--ease),border-radius .45s var(--ease)}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.03em;max-width:12ch;margin-bottom:1rem}
p{color:var(--mut);line-height:1.55;max-width:40ch;margin-bottom:1.6rem}
.go{font:inherit;cursor:pointer;background:var(--fg);color:var(--page);border:0;border-radius:3px;padding:.75rem 1.1rem}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#ov{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
#sh{position:fixed;left:0;right:0;bottom:0;height:90vh;max-width:34rem;margin:0 auto;background:var(--sheet);color:var(--fg);font-family:"Segoe UI",Helvetica,sans-serif;border-radius:14px 14px 0 0;padding:.4rem 1.4rem 2rem;transform:translateY(100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;touch-action:none}
#sh.on{visibility:visible;transition:transform .45s var(--ease)}
#sh.drag{transition:none}
#hd{width:100%;background:none;border:0;padding:.7rem 0 1rem;margin-bottom:.3rem;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:.4rem;font:600 .72rem ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#hd i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line)}
#sh h2{font-family:Georgia,serif;font-weight:400;font-size:1.7rem;margin-bottom:.5rem}
#sh li{list-style:none;padding:.7rem 0;border-top:1px solid var(--line);display:flex;justify-content:space-between}
#sh ul{margin-top:1rem;padding:0}
#hd:focus-visible{outline-offset:-3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="page">
  <h1>Pick a delivery window.</h1>
  <p>Drag the sheet up for the full week, or flick it down to dismiss. The page steps back while you choose.</p>
  <button class="go" id="open" type="button">Choose a slot</button>
</div>
<div id="ov"></div>
<div id="sh" role="dialog" aria-modal="true" aria-labelledby="ttl">
  <button id="hd" type="button" aria-label="Resize sheet, use arrow up and down"><i></i><span id="snap">Peek</span></button>
  <h2 id="ttl">Thursday windows</h2>
  <ul><li><span>08:00 to 10:00</span><span>Free</span></li><li><span>10:00 to 12:00</span><span>2 left</span></li><li><span>13:00 to 15:00</span><span>Full</span></li><li><span>15:00 to 17:00</span><span>Free</span></li><li><span>17:00 to 19:00</span><span>3 left</span></li></ul>
  <button class="go" id="done" type="button" style="margin-top:1.4rem">Confirm 08:00 to 10:00</button>
</div>
<script>
(function(){
  var CONFIG={SNAPS:[.4,.7,1],NAMES:["Peek","Half","Full"],VELOCITY:.6,SCALE:.06};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $=function(i){return document.getElementById(i)},sh=$("sh"),ov=$("ov"),pg=$("page"),hd=$("hd"),opener=$("open"),label=$("snap");
  var H=0,cur=0,y=0,sy=0,t0=0,drag=false,isOpen=false;
  function pos(i){return H*(1-CONFIG.SNAPS[i])}
  function apply(v,anim){
    y=v;sh.style.transform="translateY("+v+"px)";
    var p=Math.max(0,Math.min(1,1-v/H));
    ov.style.opacity=(.5*p).toFixed(2);
    if(!reduce){pg.style.transform="scale("+(1-CONFIG.SCALE*p)+")";pg.style.borderRadius=(14*p)+"px"}
  }
  function snap(i){cur=Math.max(0,Math.min(CONFIG.SNAPS.length-1,i));label.textContent=CONFIG.NAMES[cur];apply(pos(cur))}
  function open(){H=sh.offsetHeight;isOpen=true;sh.classList.add("on");ov.style.pointerEvents="auto";sh.style.transform="translateY("+H+"px)";void sh.offsetHeight;snap(0);hd.focus()}
  function close(){isOpen=false;apply(H);ov.style.pointerEvents="none";pg.style.transform="";pg.style.borderRadius="";setTimeout(function(){if(!isOpen)sh.classList.remove("on")},450);opener.focus()}
  hd.addEventListener("pointerdown",function(e){drag=true;sy=e.clientY-y;t0=performance.now();hd.setPointerCapture(e.pointerId);sh.classList.add("drag");hd.lastY=e.clientY;hd.v=0});
  hd.addEventListener("pointermove",function(e){
    if(!drag)return;
    var dt=Math.max(1,performance.now()-t0);hd.v=(e.clientY-hd.lastY)/dt;hd.lastY=e.clientY;t0=performance.now();
    apply(Math.max(pos(CONFIG.SNAPS.length-1),e.clientY-sy));
  });
  function end(){
    if(!drag)return;drag=false;sh.classList.remove("drag");
    if(hd.v>CONFIG.VELOCITY&&cur===0||y>H*.85){close();return}
    var best=0,d=1e9;
    CONFIG.SNAPS.forEach(function(s,i){var k=Math.abs(pos(i)+hd.v*120-y);if(k<d){d=k;best=i}});
    snap(best);
  }
  hd.addEventListener("pointerup",end);hd.addEventListener("pointercancel",end);
  opener.addEventListener("click",open);$("done").addEventListener("click",close);ov.addEventListener("click",close);
  document.addEventListener("keydown",function(e){
    if(!isOpen)return;
    if(e.key==="Escape")close();
    else if(e.target===hd&&e.key==="ArrowUp"){e.preventDefault();snap(cur+1)}
    else if(e.target===hd&&e.key==="ArrowDown"){e.preventDefault();cur===0?close():snap(cur-1)}
    else if(e.key==="Tab"){
      var f=[hd,$("done")],i=f.indexOf(document.activeElement);
      e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
    }
  });
  addEventListener("resize",function(){if(isOpen){H=sh.offsetHeight;snap(cur)}});
})();
</script>
</body>
</html>
