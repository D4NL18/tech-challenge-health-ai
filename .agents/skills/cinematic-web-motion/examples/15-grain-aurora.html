<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grain Aurora (pure CSS)</title>
<!--
  EFFECT: Blurred aurora blobs drift with independent CSS keyframes (transform only, GPU-friendly), blended
  with mix-blend-mode: screen, topped by an SVG feTurbulence grain overlay. Zero JavaScript.
  ADAPT: edit --c1..--c4 colours, --blur, --dur (drift speed), grain opacity (.grain opacity) and
  baseFrequency in the SVG filter (higher = finer grain). Add/remove .blob elements for density.
  Reduced motion: animations disabled; blobs stay as a static composition.
  Resize: fully fluid — sizes use vmax/vw units, no JS needed.
-->
<style>
  :root{--c1:#6d28d9;--c2:#0ea5e9;--c3:#ec4899;--c4:#10b981;--blur:70px;--dur:24s}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#06060a;color:#f1efe9;font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  .aurora{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 110%,#0b0b18,#06060a)}
  .blob{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(var(--blur));opacity:.55;
    mix-blend-mode:screen;will-change:transform;animation:drift var(--dur) ease-in-out infinite alternate}
  .b1{background:var(--c1);top:-20vmax;left:-10vmax}
  .b2{background:var(--c2);top:10vmax;right:-20vmax;animation-duration:calc(var(--dur)*1.3);animation-delay:-6s;width:45vmax;height:45vmax}
  .b3{background:var(--c3);bottom:-25vmax;left:15vw;animation-duration:calc(var(--dur)*.9);animation-delay:-12s;opacity:.4}
  .b4{background:var(--c4);bottom:-15vmax;right:10vw;animation-duration:calc(var(--dur)*1.6);animation-delay:-3s;width:35vmax;height:35vmax;opacity:.35}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0)}
    50%{transform:translate3d(12vw,-8vh,0) scale(1.15) rotate(90deg)}
    100%{transform:translate3d(-10vw,10vh,0) scale(.9) rotate(180deg)}
  }
  .grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.22;mix-blend-mode:overlay}
  main{position:relative;z-index:1;height:100%;display:grid;place-content:center;text-align:center;padding:2rem}
  h1{margin:0;font-weight:300;font-size:clamp(2.4rem,7.5vw,6rem);letter-spacing:-.04em;line-height:1.02}
  p{margin:1.2rem auto 0;max-width:34ch;opacity:.65;line-height:1.6}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
<main><h1>Northern<br>Lights</h1><p>Soft drifting colour with tactile film grain. Pure CSS &amp; SVG.</p></main>
</body>
</html>
