<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>44 — Before & After Comparison Curtain</title>
<!--
  EFFECT: Draggable & keyboard-accessible comparison curtain comparing a raw CNC-milled
  titanium/aluminum chassis (with CAD dimension callouts & wireframe grid) against the
  finished flagship device ("VECTRA PRO"), complete with damped pointer inertia (`gsap.quickTo`)
  and subtle 3D stage tilt following the cursor.
  ADAPT: Edit `#beforeLayer` and `#afterLayer` SVGs to compare any two states (raw vs finished,
  daylight vs night mode, exploded vs sealed). Tweak `INERTIA_DURATION` and `TILT_MAX`.
  Reduced motion: Disables 3D tilt and pointer lag; slider snaps directly to pointer/key input.
-->
<style>
  :root {
    --bg: #08090c;
    --surface: #111318;
    --border: rgba(255,255,255,0.1);
    --text: #f3f4f6;
    --muted: #8a919e;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(18px, 3vw, 40px) clamp(20px, 5vw, 72px);
    max-width: 1280px;
    margin: 0 auto;
    gap: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .presets {
    display: flex;
    gap: 8px;
  }
  .preset-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover, .preset-btn.active {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(56,189,248,0.12);
  }

  .stage-wrap {
    display: grid;
    place-items: center;
    perspective: 1200px;
  }
  .compare-card {
    position: relative;
    width: min(92vw, 880px);
    aspect-ratio: 16 / 10;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0d0f13;
    box-shadow: 0 36px 70px rgba(0,0,0,0.65);
    user-select: none;
    touch-action: none;
    will-change: transform;
  }
  .layer {
    position: absolute;
    inset: 0;
  }
  .layer svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .before-layer {
    z-index: 2;
    clip-path: inset(0 50% 0 0);
  }
  .after-layer {
    z-index: 1;
  }

  .badge {
    position: absolute;
    top: 18px;
    z-index: 4;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: rgba(8,9,12,0.75);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  .badge-left { left: 18px; color: #cbd5e1; }
  .badge-right { right: 18px; color: var(--accent); }

  /* Draggable Divider */
  .divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: rgba(255,255,255,0.85);
    z-index: 10;
    transform: translateX(-50%);
    cursor: ew-resize;
    box-shadow: 0 0 18px rgba(56,189,248,0.45);
  }
  .handle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #0f1218;
    border: 2px solid #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    display: grid;
    place-items: center;
    color: #fff;
    outline: none;
  }
  .handle:focus-visible {
    box-shadow: 0 0 0 4px rgba(56,189,248,0.55);
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 10px;
  }
  .readout {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="brand">VECTRA PRO // UNIBODY</div>
    <div class="presets">
      <button class="preset-btn" data-val="88" type="button">Raw CAD</button>
      <button class="preset-btn active" data-val="50" type="button">50 / 50</button>
      <button class="preset-btn" data-val="12" type="button">Finished</button>
    </div>
  </header>

  <main class="stage-wrap">
    <div class="compare-card" id="compareCard">
      <span class="badge badge-left">Raw CNC Billet</span>
      <span class="badge badge-right">Finished PVD</span>

      <!-- AFTER: Finished Flagship Hardware -->
      <div class="layer after-layer" id="afterLayer">
        <svg viewBox="0 0 880 550" preserveAspectRatio="xMidYMid slice">
          <defs>
            <radialGradient id="studioGlow" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#07090d"/>
            </radialGradient>
            <linearGradient id="finBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2c3340"/>
              <stop offset="50%" stop-color="#141820"/>
              <stop offset="100%" stop-color="#090b0f"/>
            </linearGradient>
            <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0284c7" stop-opacity="0.55"/>
              <stop offset="50%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
            </linearGradient>
          </defs>
          <rect width="880" height="550" fill="url(#studioGlow)"/>
          <!-- Finished Unibody -->
          <rect x="190" y="95" width="500" height="360" rx="34" fill="url(#finBody)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
          <!-- Edge-to-Edge OLED -->
          <rect x="206" y="111" width="468" height="328" rx="22" fill="url(#screenGlow)" stroke="#1e293b" stroke-width="1.5"/>
          <!-- Camera Island -->
          <rect x="236" y="138" width="108" height="108" rx="24" fill="#0d1016" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <circle cx="268" cy="170" r="18" fill="#06080c" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
          <circle cx="312" cy="170" r="18" fill="#06080c" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
          <circle cx="290" cy="214" r="18" fill="#06080c" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
          <!-- Specular Highlight -->
          <path d="M220 124 H640" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
          <text x="440" y="388" text-anchor="middle" fill="#e2e8f0" font-size="13" letter-spacing="6" font-weight="600">VECTRA PRO</text>
        </svg>
      </div>

      <!-- BEFORE: Raw Anodized / CNC Blueprint Chassis -->
      <div class="layer before-layer" id="beforeLayer">
        <svg viewBox="0 0 880 550" preserveAspectRatio="xMidYMid slice">
          <rect width="880" height="550" fill="#0e131a"/>
          <!-- Blueprint Grid -->
          <g stroke="rgba(56,189,248,0.1)" stroke-width="1">
            <path d="M0 110 H880 M0 220 H880 M0 330 H880 M0 440 H880"/>
            <path d="M176 0 V550 M352 0 V550 M528 0 V550 M704 0 V550"/>
          </g>
          <!-- Raw Bead-Blasted Chassis -->
          <rect x="190" y="95" width="500" height="360" rx="34" fill="#1d242e" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4"/>
          <rect x="206" y="111" width="468" height="328" rx="22" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2"/>
          <!-- CNC Milling Pockets -->
          <rect x="236" y="138" width="108" height="108" rx="24" fill="#141a22" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="268" cy="170" r="18" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="312" cy="170" r="18" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="290" cy="214" r="18" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
          <!-- CAD Dimension Callouts -->
          <g stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1" fill="#38bdf8" font-size="10" letter-spacing="1.5">
            <line x1="190" y1="68" x2="690" y2="68"/>
            <text x="440" y="60" text-anchor="middle">160.00 ±0.02 MM</text>
            <line x1="158" y1="95" x2="158" y2="455"/>
            <text x="148" y="275" text-anchor="end">7.4 MM</text>
          </g>
          <text x="440" y="388" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="4">GRADE-5 TI // RAW</text>
        </svg>
      </div>

      <!-- Draggable Curtain Handle -->
      <div class="divider" id="divider" role="slider" tabindex="0"
           aria-label="Comparison slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="handle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" transform="translate(-4,0)"/>
            <polyline points="9 18 15 12 9 6" transform="translate(4,0)"/>
          </svg>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>Drag divider or use Left / Right arrow keys (Shift for 10% step)</span>
    <span class="readout" id="readout">50% Raw / 50% Finished</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const card = document.getElementById('compareCard');
  const beforeLayer = document.getElementById('beforeLayer');
  const divider = document.getElementById('divider');
  const readout = document.getElementById('readout');
  const presetBtns = document.querySelectorAll('.preset-btn');

  let currentPct = 50;
  let dragging = false;

  const state = { pct: 50 };
  const setPctSmooth = reduceMotion
    ? (v) => { state.pct = v; renderSplit(v); }
    : gsap.quickTo(state, 'pct', {
        duration: 0.28,
        ease: 'power3.out',
        onUpdate: () => renderSplit(state.pct)
      });

  const tiltX = reduceMotion ? null : gsap.quickTo(card, 'rotationY', { duration: 0.5, ease: 'power2.out' });
  const tiltY = reduceMotion ? null : gsap.quickTo(card, 'rotationX', { duration: 0.5, ease: 'power2.out' });

  function renderSplit(pct) {
    const clamped = Math.max(0, Math.min(100, pct));
    beforeLayer.style.clipPath = `inset(0 ${100 - clamped}% 0 0)`;
    divider.style.left = clamped + '%';
    divider.setAttribute('aria-valuenow', Math.round(clamped));
    const r = Math.round(clamped);
    readout.textContent = `${r}% Raw / ${100 - r}% Finished`;
  }

  function updateFromPointer(clientX) {
    const rect = card.getBoundingClientRect();
    const pct = ((clientX - rect.left) / rect.width) * 100;
    currentPct = Math.max(0, Math.min(100, pct));
    setPctSmooth(currentPct);
    presetBtns.forEach((b) => b.classList.remove('active'));
  }

  card.addEventListener('pointerdown', (e) => {
    dragging = true;
    card.setPointerCapture(e.pointerId);
    updateFromPointer(e.clientX);
  });
  card.addEventListener('pointermove', (e) => {
    if (dragging) updateFromPointer(e.clientX);
    if (!reduceMotion && tiltX && tiltY) {
      const rect = card.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      tiltX(nx * 5);
      tiltY(-ny * 4);
    }
  });
  card.addEventListener('pointerup', () => { dragging = false; });
  card.addEventListener('pointerleave', () => {
    dragging = false;
    if (!reduceMotion && tiltX && tiltY) { tiltX(0); tiltY(0); }
  });

  // Keyboard accessibility
  divider.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 10 : 2;
    if (e.key === 'ArrowLeft') { e.preventDefault(); currentPct = Math.max(0, currentPct - step); setPctSmooth(currentPct); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); currentPct = Math.min(100, currentPct + step); setPctSmooth(currentPct); }
    else if (e.key === 'Home') { e.preventDefault(); currentPct = 0; setPctSmooth(0); }
    else if (e.key === 'End') { e.preventDefault(); currentPct = 100; setPctSmooth(100); }
  });

  presetBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      presetBtns.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentPct = Number(btn.dataset.val);
      setPctSmooth(currentPct);
    });
  });

  renderSplit(50);
})();
</script>
</body>
</html>
