<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>92 · Cursor Follow Tooltip Card</title>
<!--
PATTERN: A track list for a record label. Hovering a row shows a preview card (cover, year, length)
  that trails the cursor with lerp smoothing and flips to the other side near viewport edges.
Motion: rAF loop eases card position toward the pointer (LERP per frame). Card opacity/scale
  transition 220ms cubic-bezier(.2,.7,.2,1). Offset flips left/up when it would overflow.
Accessibility: Every row is a link; the same details are always in the DOM as visible small text on
  touch and exposed to keyboard: focus shows the card pinned beside the row (no cursor needed).
  Card is aria-hidden because the info is duplicated in-row (.sub). Touch / coarse pointer: no
  floating card, the details line is simply shown inline.
  prefers-reduced-motion: card snaps to the pointer (no lerp, no scale).
Adapting: LERP, OFFSET, EDGE in the CONFIG. Libraries: none.
-->
<style>
:root{--bg:#ece6d8;--ink:#201b16;--mute:#5a5145;--accent:#c2410c;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 "Helvetica Neue",Arial,sans-serif;padding:8vh 7vw;min-height:100vh}
h1{font:400 clamp(2.4rem,7vw,6rem)/.95 Georgia,serif;letter-spacing:-.03em;max-width:12ch}
.lede{margin:1rem 0 6vh 14vw;max-width:36ch;color:var(--mute)}
ol{list-style:none;padding:0;margin-left:14vw;border-top:1px solid var(--ink)}
li a{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.1rem .5rem;color:inherit;text-decoration:none;border-bottom:1px solid var(--ink);transition:padding .35s var(--ease),color .25s}
li a:hover,li a:focus-visible{padding-left:1.4rem;color:var(--accent)}
li a:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.t{font:400 1.7rem/1.1 Georgia,serif}
.sub{display:none;font-size:.85rem;color:var(--mute)}
.card{position:fixed;left:0;top:0;width:200px;pointer-events:none;background:var(--ink);color:var(--bg);padding:.6rem;opacity:0;transform:scale(.92);transition:opacity .22s var(--ease),transform .22s var(--ease);z-index:5}
.card.on{opacity:1;transform:scale(1)}
.cov{aspect-ratio:1;margin-bottom:.5rem}
.card b{display:block;font:italic 400 1.1rem/1.2 Georgia,serif}
.card span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
@media(hover:none),(pointer:coarse){.card{display:none}.sub{display:block}}
@media(max-width:720px){.lede,ol{margin-left:0}}
@media(prefers-reduced-motion:reduce){.card,li a{transition:none}}
</style>
</head>
<body>
<h1>Side B, remastered.</h1>
<p class="lede">Six tracks from the Calle Sur sessions, recorded on tape in a Valparaiso garage.</p>
<ol>
  <li><a href="#" data-c="#8f3b1b" data-y="1998" data-l="4:12"><span class="t">Marea Baja</span><span class="sub">1998 · 4:12</span></a></li>
  <li><a href="#" data-c="#2f4a3a" data-y="1999" data-l="3:47"><span class="t">Ferretería</span><span class="sub">1999 · 3:47</span></a></li>
  <li><a href="#" data-c="#b8892b" data-y="1999" data-l="5:30"><span class="t">Cerro Alegre</span><span class="sub">1999 · 5:30</span></a></li>
  <li><a href="#" data-c="#4a3a2e" data-y="2001" data-l="2:58"><span class="t">Sal en el Pelo</span><span class="sub">2001 · 2:58</span></a></li>
  <li><a href="#" data-c="#7a2e2e" data-y="2003" data-l="6:21"><span class="t">Último Tranvía</span><span class="sub">2003 · 6:21</span></a></li>
</ol>
<div class="card" id="card" aria-hidden="true"><div class="cov" id="cov"></div><b id="ct"></b><span id="cm"></span></div>
<script>
(function(){
  var CONFIG={LERP:.16,OFFSET:22,EDGE:12};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(matchMedia("(hover:none),(pointer:coarse)").matches)return;
  var card=document.getElementById("card"),cov=document.getElementById("cov"),
      ct=document.getElementById("ct"),cm=document.getElementById("cm");
  var tx=0,ty=0,x=0,y=0,raf=0,on=false;
  function show(a){
    cov.style.background=a.dataset.c;
    ct.textContent=a.querySelector(".t").textContent;
    cm.textContent=a.dataset.y+" · "+a.dataset.l;
    on=true;card.classList.add("on");
    if(!raf)raf=requestAnimationFrame(loop);
  }
  function hide(){on=false;card.classList.remove("on")}
  function target(px,py){
    var w=card.offsetWidth,h=card.offsetHeight,o=CONFIG.OFFSET;
    tx=px+o;ty=py+o;
    if(tx+w>innerWidth-CONFIG.EDGE)tx=px-o-w;
    if(ty+h>innerHeight-CONFIG.EDGE)ty=py-o-h;
    tx=Math.max(CONFIG.EDGE,tx);ty=Math.max(CONFIG.EDGE,ty);
  }
  function loop(){
    if(reduce){x=tx;y=ty}else{x+=(tx-x)*CONFIG.LERP;y+=(ty-y)*CONFIG.LERP}
    card.style.left=x+"px";card.style.top=y+"px";
    raf=(on||Math.abs(tx-x)>.5||Math.abs(ty-y)>.5)?requestAnimationFrame(loop):0;
  }
  [].forEach.call(document.querySelectorAll("li a"),function(a){
    a.addEventListener("pointerenter",function(e){target(e.clientX,e.clientY);if(!on){x=tx;y=ty}show(a)});
    a.addEventListener("pointermove",function(e){target(e.clientX,e.clientY)});
    a.addEventListener("pointerleave",hide);
    a.addEventListener("focus",function(){var r=a.getBoundingClientRect();target(r.right-CONFIG.OFFSET*4,r.top);x=tx;y=ty;show(a)});
    a.addEventListener("blur",hide);
  });
})();
</script>
</body>
</html>
