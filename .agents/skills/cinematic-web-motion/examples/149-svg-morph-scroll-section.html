<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>149 · SVG Morph Scroll Section</title>
<!--
PATTERN: One SVG path morphs through four shapes (boule, baguette, pan loaf, croissant) as you scroll through four
  stages of a sticky section. Each stage has its own caption, colour and number; the shape holds at each stop and
  morphs between them.
Motion: every shape is converted to 96 points resampled by arc length from the same start point, so any two
  shapes interpolate point by point (no library needed). Local progress t between stages is eased with a plateau
  (hold, then smoothstep), the path "d" is rebuilt per frame; fill colour and rotation are interpolated too.
Accessibility: Section has four real captions (the active one is aria-live polite); the SVG is decorative
  (aria-hidden). prefers-reduced-motion: the sticky stage is dropped and each stage shows its own static SVG shape.
Adapting: Edit SHAPES (polygon generators), STAGES copy, colours. Keep point count equal for all shapes.
  Libraries: none.
-->
<style>
:root{--flour:#f2ead9;--crust:#b8672f;--ink:#201a15;--rye:#5a3b24;--sage:#6d7a52;--butter:#e8b94a;--rose:#c44f3a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--flour);color:var(--ink);font-family:var(--sans);line-height:1.55;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
.nav{display:flex;justify-content:space-between;padding:22px clamp(18px,4vw,48px);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase}
.nav b{font:italic 400 1.2rem var(--serif);letter-spacing:0;text-transform:none}
.hero{padding:10vh clamp(18px,4vw,48px) 12vh;display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px}
.hero h1{grid-column:1/11;font:400 clamp(3rem,9.6vw,9.2rem)/.9 var(--serif);letter-spacing:-.035em}
.hero h1 em{color:var(--rose)}
.hero p{grid-column:1/6;margin-top:28px;max-width:38ch;font-size:1.05rem}
.track{position:relative;height:420vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px;padding:0 clamp(18px,4vw,48px);align-items:center;transition:background-color .6s}
.shape{grid-column:6/13;grid-row:1;display:grid;place-items:center}
.shape svg{width:min(78vh,100%);height:auto;overflow:visible}
.caps{grid-column:1/6;grid-row:1;position:relative;height:60vh;align-self:center}
.cap{position:absolute;left:0;top:0;width:100%;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .7s cubic-bezier(.16,1,.3,1);pointer-events:none}
.cap.on{opacity:1;transform:none;pointer-events:auto}
.cap .n{font:400 clamp(4rem,10vw,9rem)/.8 var(--serif);color:var(--rose);letter-spacing:-.04em}
.cap h2{font:400 clamp(2rem,4.2vw,3.8rem)/1 var(--serif);letter-spacing:-.025em;margin:14px 0 14px}
.cap p{max-width:36ch}
.cap small{display:block;margin-top:18px;font:600 .72rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--rye)}
.dots{position:absolute;left:clamp(18px,4vw,48px);bottom:6vh;display:flex;gap:10px}
.dots i{width:34px;height:3px;background:rgba(32,26,21,.25);transition:background .3s}
.dots i.on{background:var(--ink)}
.end{padding:16vh clamp(18px,4vw,48px);background:var(--ink);color:var(--flour);display:grid;grid-template-columns:repeat(12,1fr);gap:0 16px;align-items:end}
.end h2{grid-column:1/9;font:400 clamp(2.4rem,6vw,5.4rem)/.95 var(--serif);letter-spacing:-.03em}
.end a{grid-column:9/13;justify-self:start;padding:15px 26px;background:var(--butter);color:var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;transition:transform .25s,background .25s}
.end a:hover{background:var(--flour);transform:translateX(6px)}
.static-shapes{display:none}
@media (max-width:760px){
  .hero h1,.hero p{grid-column:1/13}
  .stage{grid-template-rows:42% 1fr;align-items:start;padding-top:70px}
  .shape{grid-column:1/13;grid-row:1}.shape svg{width:min(44vh,90%)}
  .caps{grid-column:1/13;grid-row:2;height:auto;min-height:40vh}
  .cap .n{font-size:3.2rem}.cap h2{font-size:1.8rem}.dots{bottom:4vh}
  .end h2,.end a{grid-column:1/13}.end a{margin-top:26px}
}
@media (prefers-reduced-motion:reduce){
  .track{height:auto}.stage{position:static;height:auto;display:block;padding:8vh clamp(18px,4vw,48px)}
  .shape{display:none}.caps{height:auto}.cap{position:static;opacity:1;transform:none;margin-bottom:8vh}
  .static-shapes{display:block}.dots{display:none}
}
</style>
</head>
<body>
<div class="nav"><b>Forno Velho</b><span>Bakery · Coimbra</span></div>
<section class="hero">
  <h1>Four breads, <em>four shapes,</em> one oven.</h1>
  <p>Our oven is a 1948 wood-fired deck that fits exactly forty loaves. Scroll to watch one lump of dough become each of the four breads we bake before sunrise.</p>
</section>

<section class="track" id="track" aria-label="The four breads">
  <div class="stage" id="stage">
    <div class="shape" aria-hidden="true">
      <svg viewBox="-110 -110 220 220"><path id="morph" d="" fill="#b8672f"/><path id="score" d="" fill="none" stroke="#f2ead9" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></svg>
    </div>
    <div class="caps" aria-live="polite" id="caps"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
</section>

<section class="end">
  <h2>Order by 8 pm, collect warm at 7 am.</h2>
  <a href="#">Reserve tomorrow's bake</a>
</section>

<script>
(function(){
  var N=96;
  function circle(cx,cy,r,a0,a1,n){var p=[];for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return p}
  function rrect(w,h,r){var p=[],q=[[w/2-r,-h/2+r,-Math.PI/2],[w/2-r,h/2-r,0],[-w/2+r,h/2-r,Math.PI/2],[-w/2+r,-h/2+r,Math.PI]];
    q.forEach(function(c){for(var i=0;i<=8;i++){var a=c[2]+Math.PI/2*i/8;p.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)])}});return p}
  function lens(L,Wd,rot){var p=[],n=72;for(var i=0;i<n;i++){var t=i/n*Math.PI*2,sn=Math.sin(t),x=Wd*Math.sign(sn)*Math.pow(Math.abs(sn),1.5),y=-L*Math.cos(t);p.push([x*Math.cos(rot)-y*Math.sin(rot),x*Math.sin(rot)+y*Math.cos(rot)])}return p}
  var CR=78,CY=34,CA0=Math.PI+.3,CA1=2*Math.PI-.3;
  function crescent(){var p=[],i,n=40,t,a,w;
    for(i=0;i<=n;i++){t=i/n;a=CA0+(CA1-CA0)*t;w=32*Math.pow(Math.sin(Math.PI*t),.75);p.push([(CR+w)*Math.cos(a),CY+(CR+w)*Math.sin(a)])}
    for(i=n;i>=0;i--){t=i/n;a=CA0+(CA1-CA0)*t;w=32*Math.pow(Math.sin(Math.PI*t),.75);p.push([(CR-w)*Math.cos(a),CY+(CR-w)*Math.sin(a)])}
    return p}
  function crScore(){var s="";[.2,.35,.5,.65,.8].forEach(function(t){var a=CA0+(CA1-CA0)*t,w=26*Math.pow(Math.sin(Math.PI*t),.75);
    s+="M"+((CR-w)*Math.cos(a-.05)).toFixed(1)+" "+(CY+(CR-w)*Math.sin(a-.05)).toFixed(1)+"L"+((CR+w)*Math.cos(a+.05)).toFixed(1)+" "+(CY+(CR+w)*Math.sin(a+.05)).toFixed(1)});return s}
  var SHAPES=[
    {pts:circle(0,0,80,-Math.PI/2,Math.PI*1.5,N-1).slice(0,N-1),rot:0,col:"#b8672f",score:"M-34 -26 Q 0 -44 34 -26 M-40 6 Q 0 -14 40 6 M-30 36 Q 0 20 30 36"},
    {pts:lens(100,34,Math.PI/4),rot:0,col:"#c98a43",score:"M-10 -62 L12 -44 M-22 -24 L2 -6 M-4 14 L18 32 M-24 38 L-6 54"},
    {pts:rrect(168,92,26),rot:0,col:"#7a5230",score:"M-52 -22 V24 M-18 -22 V24 M16 -22 V24 M50 -22 V24"},
    {pts:crescent(),rot:0,col:"#d8a24a",score:crScore()}
  ];
  function resample(poly){
    // start at the point closest to the top, orient clockwise, resample by arc length to N points
    var pts=poly.slice(),area=0,i;for(i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length];area+=a[0]*b[1]-b[0]*a[1]}
    if(area<0)pts.reverse();
    var si=0,best=1e9;pts.forEach(function(p,k){var s=p[1]*1.0+Math.abs(p[0])*.3;if(s<best){best=s;si=k}});
    pts=pts.slice(si).concat(pts.slice(0,si));pts.push(pts[0]);
    var L=[0];for(i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    var tot=L[L.length-1],out=[],j=1;
    for(i=0;i<N;i++){var d=tot*i/N;while(j<L.length-1&&L[j]<d)j++;var t=(d-L[j-1])/((L[j]-L[j-1])||1);out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*t,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*t])}
    return out;
  }
  SHAPES.forEach(function(s){s.r=resample(s.pts)});
  var STAGES=[
    ["01","The boule","Sourdough, 72 percent hydration, 24 hours in the fridge. A dark crust and an open, glossy crumb.","Bake: 45 min · 240 C","#f2ead9"],
    ["02","The baguette","Long, thin and cut with five quick slashes. It is best in the first three hours and we will not apologise for that.","Bake: 22 min · 250 C","#efe0bf"],
    ["03","The pan loaf","Rye and wheat in a tin, scored with straight lines. Our daily toast bread and the one the school orders by the dozen.","Bake: 55 min · 220 C","#e8d3b0"],
    ["04","The croissant","Twenty-seven layers of French butter, folded three times. We make sixty, and they are gone by nine.","Bake: 18 min · 200 C","#f3dcc0"]
  ];
  var caps=document.getElementById("caps"),dots=document.getElementById("dots");
  caps.innerHTML=STAGES.map(function(s,i){return '<article class="cap'+(i?'':' on')+'"><div class="n">'+s[0]+'</div><h2>'+s[1]+'</h2><p>'+s[2]+'</p><small>'+s[3]+'</small></article>'}).join("");
  dots.innerHTML=STAGES.map(function(_,i){return '<i'+(i?'':' class="on"')+'></i>'}).join("");
  var capEls=[].slice.call(caps.children),dotEls=[].slice.call(dots.children);
  function d(pts){return "M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("L")+"Z"}
  function hex(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
  function mixc(a,b,t){var A=hex(a),B=hex(b);return "rgb("+A.map(function(v,i){return Math.round(v+(B[i]-v)*t)}).join(",")+")"}
  var path=document.getElementById("morph"),score=document.getElementById("score"),stage=document.getElementById("stage"),track=document.getElementById("track");
  function ease(t){var h=.22;t=Math.min(Math.max((t-h)/(1-2*h),0),1);return t*t*(3-2*t)}
  function render(p){
    var i=Math.min(Math.floor(p),STAGES.length-2),t=p-i;if(p>=STAGES.length-1){i=STAGES.length-2;t=1}
    var e=ease(t),A=SHAPES[i],B=SHAPES[i+1],pts=[];
    var rot=(A.rot+(B.rot-A.rot)*e)*180/Math.PI;
    for(var k=0;k<N;k++)pts.push([A.r[k][0]+(B.r[k][0]-A.r[k][0])*e,A.r[k][1]+(B.r[k][1]-A.r[k][1])*e]);
    path.setAttribute("d",d(pts));path.setAttribute("fill",mixc(A.col,B.col,e));
    path.setAttribute("transform","rotate("+rot.toFixed(1)+")");
    score.setAttribute("d",e<.5?A.score:B.score);score.setAttribute("transform","rotate("+rot.toFixed(1)+")");score.style.opacity=(Math.abs(e-.5)*1.6).toFixed(2);
    var act=Math.round(p);act=Math.min(Math.max(act,0),STAGES.length-1);
    capEls.forEach(function(c,k){c.classList.toggle("on",k===act)});dotEls.forEach(function(c,k){c.classList.toggle("on",k===act)});
    stage.style.backgroundColor=mixc(STAGES[Math.min(Math.floor(p),3)][4],STAGES[Math.min(Math.floor(p)+1,3)][4],e*(Math.floor(p)<3?1:0));
  }
  // static fallback (reduced motion)
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    capEls.forEach(function(c,k){var S=SHAPES[k];c.insertAdjacentHTML("afterbegin",'<svg viewBox="-110 -110 220 220" style="width:140px;display:block;margin-bottom:12px" aria-hidden="true"><path d="'+d(S.r)+'" fill="'+S.col+'" transform="rotate('+(S.rot*180/Math.PI)+')"/></svg>')});
    return;
  }
  var ticking=false;
  function frame(){ticking=false;var r=track.getBoundingClientRect(),sp=Math.min(Math.max(-r.top/Math.max(r.height-innerHeight,1),0),1);render(sp*(STAGES.length-1))}
  function req(){if(!ticking){ticking=true;requestAnimationFrame(frame)}}
  addEventListener("scroll",req,{passive:true});addEventListener("resize",req);frame();
})();
</script>
</body>
</html>
