<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>84 · Animated Checkbox Todo</title>
<!--
PATTERN: A press-day checklist. Ticking an item draws the check mark, wipes a strike-through across
  the label, then the row glides to the "done" group below (FLIP reorder). Unticking reverses it.
Motion: SVG path stroke-dashoffset draws the tick; a background-size gradient wipes the strike line
  left to right; FLIP (First, Last, Invert, Play) with element.animate() moves every row that
  changed position, so the list never jumps.
Accessibility: Native <input type="checkbox"> stays in the DOM (keyboard Space, screen readers);
  done state is also shown by the strike-through and a "Done" word, not colour alone. Focus is
  restored after the DOM reorder. prefers-reduced-motion: states switch instantly, no FLIP.
Adapting: DURATION, STAGGER, EASE in CONFIG. Libraries: none.
-->
<style>
:root{--paper:#f1ebdd;--ink:#1c1915;--rule:#cdc2ad;--moss:#3d5a38;--rust:#a63a1c;--ease:cubic-bezier(.2,.7,.2,1);
--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:"Avenir Next","Segoe UI","Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:10vh 6vw 12vh 14vw}
h1{font:600 clamp(2.2rem,6vw,4.2rem)/1 var(--serif);letter-spacing:-.03em}
.meta{margin:.8rem 0 2.4rem;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}
ul{list-style:none;padding:0;max-width:560px;border-top:2px solid var(--ink)}
li{border-bottom:1px solid var(--rule)}
label{display:flex;align-items:center;gap:1rem;padding:1rem .2rem;cursor:pointer}
input{position:absolute;opacity:0;width:1.6rem;height:1.6rem;margin:0}
.box{flex:none;width:1.7rem;height:1.7rem;border:2px solid var(--ink)}
.box svg{display:block;width:100%;height:100%}
.box path{fill:none;stroke:var(--moss);stroke-width:3.2;stroke-linecap:square;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset var(--t,.35s) var(--ease)}
.txt{flex:1;min-width:0;font:500 1.15rem/1.35 var(--serif);transition:opacity .3s}
.txt span{background:linear-gradient(var(--ink),var(--ink)) 0 58%/0 2px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size var(--t,.35s) var(--ease) .12s}
.tag{flex:none;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .3s}
input:checked+.box path{stroke-dashoffset:0}
input:checked~.txt{opacity:.7}
input:checked~.txt span{background-size:100% 2px}
input:checked~.tag{opacity:1}
input:focus-visible+.box{outline:3px solid var(--rust);outline-offset:3px}
label:hover .box{background:#e6dcc7}
@media (prefers-reduced-motion:reduce){.box path,.txt,.txt span,.tag{transition:none}}
</style>
</head>
<body>
<h1>Press day, 14 March</h1>
<p class="meta"><span id="count"></span></p>
<ul id="list"></ul>
<script>
(function(){
  var CONFIG={DURATION:420,STAGGER:30,EASE:"cubic-bezier(.2,.7,.2,1)"};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ITEMS=["Proof the harbour dredging story","Confirm quote from Councillor Duarte","Crop and caption the bakery photo","Fact-check the flour price table","Send final pages to the printer","File the corrections box"];
  var list=document.getElementById("list"),count=document.getElementById("count");
  if(reduce)list.style.setProperty("--t","0s");
  ITEMS.forEach(function(t,i){
    var li=document.createElement("li");li.dataset.i=i;
    li.innerHTML='<label><input type="checkbox"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="txt"><span></span></span><span class="tag">Done</span></label>';
    li.querySelector(".txt span").textContent=t;
    list.appendChild(li);
  });
  function order(){
    return [].slice.call(list.children).sort(function(a,b){
      var da=a.querySelector("input").checked?1:0,db=b.querySelector("input").checked?1:0;
      return da-db||a.dataset.i-b.dataset.i;
    });
  }
  function tally(){
    var n=list.querySelectorAll("input:checked").length;
    count.textContent=n+" of "+ITEMS.length+" done";
  }
  list.addEventListener("change",function(e){
    tally();
    var rows=[].slice.call(list.children),first={},active=document.activeElement;
    rows.forEach(function(li){first[li.dataset.i]=li.getBoundingClientRect().top});
    var sorted=order();
    var delay=reduce?0:CONFIG.DURATION*.55;
    setTimeout(function(){
      rows.forEach(function(li){first[li.dataset.i]=li.getBoundingClientRect().top});
      sorted.forEach(function(li){list.appendChild(li)});
      if(active&&active.focus)active.focus();
      if(reduce)return;
      sorted.forEach(function(li,k){
        var d=first[li.dataset.i]-li.getBoundingClientRect().top;
        if(!d)return;
        li.animate([{transform:"translateY("+d+"px)"},{transform:"none"}],{duration:CONFIG.DURATION,delay:k*CONFIG.STAGGER,easing:CONFIG.EASE,fill:"backwards"});
      });
    },delay);
  });
  tally();
})();
</script>
</body>
</html>
