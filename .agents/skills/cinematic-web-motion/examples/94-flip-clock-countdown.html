<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>94 · Flip Clock Countdown</title>
<!--
PATTERN: Split-flap countdown to a festival ticket release. Each digit is a two-half card; when the
  value changes the top half folds down, revealing the new digit, like a departure-board flap.
Motion: Per digit, a top flap (old value) rotateX 0 -> -90deg then a bottom flap (new value)
  -90 -> 0deg, 450ms total, cubic-bezier(.2,.7,.2,1), perspective 400px, backface hidden.
  Ticks once per second from a TARGET date; digits only animate when they change.
Accessibility: Visual digits are aria-hidden; a visually-hidden role="timer" text ("3 days, 4 hours")
  updates once per minute only, so screen readers are not spammed. Unit labels are visible text.
  When the date passes, text "Doors are open" replaces the clock (not colour alone).
  prefers-reduced-motion: digits swap statically, no 3D flip.
Adapting: TARGET (ISO date), FLIP_MS in the CONFIG. Libraries: none.
-->
<style>
:root{--bg:#161a1d;--panel:#262c30;--ink:#f3ecdc;--amber:#f0a030;--mute:#b2b8b4;--ease:cubic-bezier(.2,.7,.2,1);--h:clamp(3.2rem,10vw,6.6rem)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 "Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:9vh 7vw}
h1{font:400 clamp(2.2rem,6.5vw,5.5rem)/.98 Georgia,serif;letter-spacing:-.03em;max-width:13ch}
.lede{margin:1rem 0 6vh;max-width:36ch;color:var(--mute)}
.clock{display:flex;gap:clamp(.8rem,3vw,2.5rem);margin-left:clamp(0rem,9vw,8rem)}
.unit{display:flex;flex-direction:column;gap:.6rem}
.unit>div{display:flex;gap:.3rem}
.unit span.lab{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.d{position:relative;width:clamp(2.2rem,7vw,4.6rem);height:var(--h);perspective:400px;font:700 clamp(2.4rem,7.5vw,5rem)/1 Georgia,serif;color:var(--amber)}
.d i,.d b{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--panel);font-style:normal;text-align:center;backface-visibility:hidden}
.d i::after,.d b::after{content:attr(data-v);position:absolute;left:0;right:0;line-height:var(--h)}
.top{top:0;border-radius:4px 4px 0 0;border-bottom:1px solid var(--bg);transform-origin:bottom}
.bot{bottom:0;border-radius:0 0 4px 4px;transform-origin:top}
.bot::after{bottom:0}
.top::after{top:0}
.d .fl{z-index:2;transition:transform calc(var(--ms,450ms)/2) var(--ease)}
.d .ft{top:0;transform-origin:bottom;border-radius:4px 4px 0 0}
.d .fb{bottom:0;transform-origin:top;transform:rotateX(90deg);border-radius:0 0 4px 4px}
.d .fb::after{bottom:0}.d .ft::after{top:0}
.go .ft{transform:rotateX(-90deg)}
.go .fb{transform:rotateX(0);transition-delay:calc(var(--ms,450ms)/2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.done{display:none;font:italic 400 2rem Georgia,serif;color:var(--amber)}
.done::before{content:"\2713\00a0"}
.over .clock{display:none}.over .done{display:block}
@media(max-width:560px){:root{--h:2.9rem}.clock{gap:.55rem;margin-left:0}.unit>div{gap:.15rem}.d{width:1.6rem;font-size:2rem}.unit span.lab{font-size:.6rem;letter-spacing:.06em}}
@media(prefers-reduced-motion:reduce){.d .fl{transition:none}}
</style>
</head>
<body>
<h1>Tickets open soon.</h1>
<p class="lede">Harbour Sessions, three nights on the old pier. General sale starts when the clock hits zero.</p>
<div class="clock" aria-hidden="true" id="clock"></div>
<p class="done" id="done">Doors are open. Tickets are on sale now.</p>
<p class="sr" role="timer" id="sr"></p>
<script>
(function(){
  var CONFIG={TARGET:new Date(Date.now()+3*864e5+4*36e5+27*6e4+50*1e3).toISOString(),FLIP_MS:450};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var units=["Days","Hours","Minutes","Seconds"],clock=document.getElementById("clock"),sr=document.getElementById("sr"),
      body=document.body,digits=[],last="",lastMin=-1;
  document.documentElement.style.setProperty("--ms",CONFIG.FLIP_MS+"ms");
  units.forEach(function(u){
    var wrap=document.createElement("div");wrap.className="unit";
    var row=document.createElement("div");
    for(var i=0;i<2;i++){
      var d=document.createElement("div");d.className="d";
      d.innerHTML='<i class="top" data-v="0"></i><b class="bot" data-v="0"></b><i class="fl ft" data-v="0"></i><b class="fl fb" data-v="0"></b>';
      row.appendChild(d);digits.push({el:d,v:"0",busy:false});
    }
    var l=document.createElement("span");l.className="lab";l.textContent=u;
    wrap.appendChild(row);wrap.appendChild(l);clock.appendChild(wrap);
  });
  function setAll(d,v,part){[].forEach.call(d.el.querySelectorAll(part),function(n){n.setAttribute("data-v",v)})}
  function flip(d,v){
    if(d.v===v)return;
    var el=d.el,old=d.v;d.v=v;
    if(reduce){setAll(d,v,"i,b");return}
    setAll(d,old,".ft");setAll(d,v,".fb");setAll(d,v,".top");
    el.classList.remove("go");el.offsetWidth;el.classList.add("go");
    setTimeout(function(){setAll(d,v,"i,b");el.classList.remove("go")},CONFIG.FLIP_MS+30);
  }
  function pad(n){return(n<10?"0":"")+n}
  function tick(){
    var ms=new Date(CONFIG.TARGET)-Date.now();
    if(ms<=0){body.classList.add("over");sr.textContent="Doors are open. Tickets are on sale now.";return}
    var s=Math.floor(ms/1e3),vals=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    var str=vals.map(pad).join("");
    for(var i=0;i<8;i++)flip(digits[i],str.charAt(i));
    if(lastMin!==vals[2]){lastMin=vals[2];sr.textContent=vals[0]+" days, "+vals[1]+" hours, "+vals[2]+" minutes remaining"}
    setTimeout(tick,1000-(Date.now()%1000));
  }
  tick();
})();
</script>
</body>
</html>
