<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>34 · File Dropzone with Upload Progress</title>
<!--
  PATTERN: Drag-and-drop / click / paste file dropzone with per-file progress rows (simulated upload), cancel,
           retry and validation (type + size).
  Motion: dropzone border + background change in 120ms while dragging over; rows enter with fade + 6px rise in
          160ms; progress bars use transform: scaleX (GPU friendly) and settle with a 120ms transition; rows
          collapse out with a grid-template-rows 0fr transition in 180ms.
  Accessibility: the zone is a real <button> (Enter/Space opens the file picker) wrapping a hidden file input;
          progress uses role="progressbar" with aria-valuenow; status text is announced through an aria-live
          region; each row has labelled Cancel/Retry/Remove buttons. prefers-reduced-motion removes entrance and
          collapse animation (progress still updates).
  Adapting: replace simulate() with XMLHttpRequest/fetch upload using xhr.upload.onprogress to call setProgress().
          Tune LIMIT_MB and ACCEPT. Demo fails ~1 in 4 uploads to show the retry path.
-->
<style>
  :root { --bg:#fafafa; --surface:#fff; --fg:#18181b; --mut:#71717a; --bd:rgba(0,0,0,.08); --bd2:rgba(0,0,0,.2);
    --acc:#4f46e5; --ok:#16a34a; --err:#dc2626; --hover:#f4f4f5; --track:#e4e4e7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --surface:#18181b; --fg:#fafafa; --mut:#a1a1aa; --bd:rgba(255,255,255,.10); --bd2:rgba(255,255,255,.24);
      --acc:#818cf8; --ok:#4ade80; --err:#f87171; --hover:#27272a; --track:#3f3f46; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:start center; padding:8vh 1rem; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { width:min(520px,100%); }
  .zone { width:100%; display:grid; gap:4px; place-items:center; padding:36px 16px; background:var(--surface); color:var(--fg);
    border:1.5px dashed var(--bd2); border-radius:12px; font:inherit; cursor:pointer; text-align:center;
    transition:border-color 120ms, background 120ms; }
  .zone:hover { background:var(--hover); }
  .zone.drag { border-color:var(--acc); background:var(--hover); }
  .zone small { color:var(--mut); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  ul { list-style:none; margin-top:14px; display:grid; }
  li.wrapper { display:grid; grid-template-rows:1fr; transition:grid-template-rows 180ms ease, opacity 180ms; }
  li.wrapper.gone { grid-template-rows:0fr; opacity:0; }
  li.wrapper > .inner { overflow:hidden; }
  .file { display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 12px; margin-bottom:8px; background:var(--surface);
    border:1px solid var(--bd); border-radius:10px; animation:rise 160ms ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--mut); font-size:12px; }
  .meta.err { color:var(--err); }
  .meta.ok { color:var(--ok); }
  .bar { grid-column:1 / -1; height:4px; border-radius:2px; background:var(--track); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); transform-origin:left; transform:scaleX(0); transition:transform 120ms linear; }
  .done .bar i { background:var(--ok); }
  .failed .bar i { background:var(--err); }
  .acts button { border:0; background:none; color:var(--mut); font:inherit; padding:2px 6px; border-radius:6px; cursor:pointer; }
  .acts button:hover { background:var(--hover); color:var(--fg); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .file { animation:none; } li.wrapper, .zone { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <button type="button" class="zone" id="zone" aria-describedby="rules">
    <b>Drop files here, paste, or browse</b>
    <small id="rules">PNG, JPG, PDF · up to 5 MB each</small>
  </button>
  <input type="file" id="picker" multiple accept="image/png,image/jpeg,application/pdf" hidden>
  <ul id="list" aria-label="Uploads"></ul>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
</div>
<script>
(function () {
  var LIMIT_MB = 5, ACCEPT = ['image/png', 'image/jpeg', 'application/pdf'];
  var zone = document.getElementById('zone'), picker = document.getElementById('picker');
  var list = document.getElementById('list'), live = document.getElementById('live');
  var uid = 0;

  function size(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
  function say(t) { live.textContent = t; }

  function add(file) {
    var id = ++uid, li = document.createElement('li');
    li.className = 'wrapper';
    li.innerHTML = '<div class="inner"><div class="file">' +
      '<span class="name"></span><span class="acts"></span>' +
      '<span class="meta"></span><span></span>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div></div></div>';
    var box = li.querySelector('.file'), name = li.querySelector('.name');
    var acts = li.querySelector('.acts'), meta = li.querySelector('.meta');
    var bar = li.querySelector('.bar'), fill = bar.firstChild;
    name.textContent = file.name; bar.setAttribute('aria-label', 'Upload ' + file.name);
    list.appendChild(li);

    var timer = null, pct = 0;
    function btn(label, fn) {
      acts.innerHTML = '';
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.setAttribute('aria-label', label + ' ' + file.name); b.addEventListener('click', fn); acts.appendChild(b); return b;
    }
    function setProgress(p) {
      pct = p; fill.style.transform = 'scaleX(' + p / 100 + ')'; bar.setAttribute('aria-valuenow', String(Math.round(p)));
      meta.textContent = Math.round(p) + '% · ' + size(file.size);
    }
    function remove() {
      clearInterval(timer);
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return li.remove();
      li.classList.add('gone'); setTimeout(function () { li.remove(); }, 190);
    }
    function start() {
      box.classList.remove('failed', 'done'); meta.className = 'meta'; setProgress(0);
      var willFail = Math.random() < 0.25, failAt = 30 + Math.random() * 50;
      btn('Cancel', function () { say(file.name + ' cancelled'); remove(); }).focus();
      timer = setInterval(function () {
        setProgress(Math.min(100, pct + 4 + Math.random() * 9));
        if (willFail && pct >= failAt) {
          clearInterval(timer); box.classList.add('failed'); meta.className = 'meta err'; meta.textContent = 'Upload failed — network error';
          btn('Retry', start).focus(); say(file.name + ' failed');
        } else if (pct >= 100) {
          clearInterval(timer); box.classList.add('done'); meta.className = 'meta ok'; meta.textContent = 'Uploaded · ' + size(file.size);
          btn('Remove', remove); say(file.name + ' uploaded');
        }
      }, 120);
    }
    start();
  }
  function handle(files) {
    [].forEach.call(files, function (f) {
      if (ACCEPT.indexOf(f.type) < 0) return say(f.name + ' rejected: unsupported type');
      if (f.size > LIMIT_MB * 1048576) return say(f.name + ' rejected: larger than ' + LIMIT_MB + ' MB');
      add(f);
    });
  }

  zone.addEventListener('click', function () { picker.click(); });
  picker.addEventListener('change', function () { handle(picker.files); picker.value = ''; });
  ['dragenter', 'dragover'].forEach(function (n) {
    zone.addEventListener(n, function (e) { e.preventDefault(); zone.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (n) {
    zone.addEventListener(n, function (e) { e.preventDefault(); zone.classList.remove('drag'); });
  });
  zone.addEventListener('drop', function (e) { handle(e.dataTransfer.files); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
  document.addEventListener('paste', function (e) { if (e.clipboardData && e.clipboardData.files.length) handle(e.clipboardData.files); });
})();
</script>
</body>
</html>
