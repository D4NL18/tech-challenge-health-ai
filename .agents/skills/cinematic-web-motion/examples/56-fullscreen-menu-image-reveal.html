<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>56 · Fullscreen Menu Image Reveal</title>
<!--
PATTERN: Fullscreen overlay menu with staggered links and a hover image that follows the cursor.
Motion: Overlay clip-path wipes in, links rise with stagger (GSAP timeline); a procedural gradient "image" follows the pointer with lerp and swaps per link.
Accessibility: Toggle button with aria-expanded, Escape closes, focus moves into menu and returns; reduced-motion uses instant show/hide and no follow.
Adapting: Edit LINKS (label + hue); replace the gradient card with an <img> per link.
-->
<style>
:root{--bg:#0e0e0c;--fg:#f1ede4}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 6vw;position:relative;z-index:30}
button{font:inherit;color:inherit;background:none;border:1px solid #ffffff55;border-radius:99px;padding:.6rem 1.2rem;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}
button:focus-visible,.menu a:focus-visible{outline:3px solid #ff5a36;outline-offset:4px}
.hero{padding:16vh 6vw;font-size:clamp(3rem,11vw,9rem);letter-spacing:-.05em;line-height:.9;font-weight:600}
.menu{position:fixed;inset:0;z-index:20;background:#ff5a36;color:#111;clip-path:inset(0 0 100% 0);visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 6vw}
.menu ul{list-style:none;padding:0}
.menu a{display:inline-block;color:inherit;text-decoration:none;font-size:clamp(2.5rem,9vw,7rem);font-weight:600;letter-spacing:-.04em;line-height:1.05;transition:opacity .3s}
.menu ul:hover a:not(:hover){opacity:.3}
.li{overflow:hidden}.li a{display:block}
.pic{position:fixed;left:0;top:0;width:min(28vw,260px);aspect-ratio:4/5;border-radius:14px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.8);transition:opacity .25s,scale .25s;z-index:25;background:hsl(var(--h,0) 70% 50%);box-shadow:0 20px 50px #0005}
.pic.on{opacity:1}
@media (hover:none){.pic{display:none}}
</style>
</head>
<body>
<header><strong>Studio</strong><button id="btn" aria-expanded="false" aria-controls="menu">Menu</button></header>
<div class="hero">Open the menu.</div>
<nav class="menu" id="menu" aria-label="Main"><ul id="list"></ul></nav>
<div class="pic" id="pic" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  var LINKS=[["Work",15],["Studio",200],["Journal",280],["Contact",120]];
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches||!window.gsap;
  var list=document.getElementById("list"),menu=document.getElementById("menu"),btn=document.getElementById("btn"),pic=document.getElementById("pic");
  LINKS.forEach(function(l){var li=document.createElement("li");li.className="li";li.innerHTML='<a href="#'+l[0].toLowerCase()+'">'+l[0]+'</a>';list.appendChild(li);
    var a=li.firstChild;
    a.addEventListener("pointerenter",function(){pic.style.setProperty("--h",l[1]);pic.classList.add("on")});
    a.addEventListener("pointerleave",function(){pic.classList.remove("on")});
    a.addEventListener("click",function(){toggle(false)});
  });
  var open=false,x=0,y=0,tx=0,ty=0,raf;
  function toggle(v){
    open=v;btn.setAttribute("aria-expanded",String(v));btn.textContent=v?"Close":"Menu";
    var links=menu.querySelectorAll(".li a");
    if(reduce){menu.style.visibility=v?"visible":"hidden";menu.style.clipPath=v?"inset(0)":"inset(0 0 100% 0)";if(v)links[0].focus();else btn.focus();return}
    if(v){menu.style.visibility="visible";
      gsap.timeline().to(menu,{clipPath:"inset(0 0 0% 0)",duration:.7,ease:"expo.inOut"}).fromTo(links,{yPercent:110},{yPercent:0,duration:.8,stagger:.08,ease:"expo.out"},"-=.3").add(function(){links[0].focus()});
    }else{
      gsap.timeline().to(menu,{clipPath:"inset(100% 0 0 0)",duration:.6,ease:"expo.inOut"}).set(menu,{visibility:"hidden",clipPath:"inset(0 0 100% 0)"});
      btn.focus();
    }
  }
  btn.addEventListener("click",function(){toggle(!open)});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&open)toggle(false)});
  if(reduce)return;
  addEventListener("pointermove",function(e){tx=e.clientX;ty=e.clientY;if(!raf)raf=requestAnimationFrame(loop)});
  function loop(){x+=(tx-x)*.15;y+=(ty-y)*.15;pic.style.left=x+"px";pic.style.top=y+"px";
    raf=(Math.abs(tx-x)+Math.abs(ty-y)>.5)?requestAnimationFrame(loop):null}
})();
</script>
</body>
</html>
