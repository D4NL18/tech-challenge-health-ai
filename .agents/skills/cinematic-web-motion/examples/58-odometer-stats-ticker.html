<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>58 · Odometer Stats Ticker</title>
<!--
PATTERN: Rolling-digit odometer counters triggered on view.
Motion: Each digit is a vertical 0-9 reel translated with CSS transitions (staggered per digit) when the counter enters the viewport (IntersectionObserver, no library).
Accessibility: Real value exposed via aria-label on each counter; reels are aria-hidden; reduced-motion jumps to final value.
Adapting: Edit the data-value / data-prefix / data-suffix attributes; tune CONFIG.dur and CONFIG.stagger.
-->
<style>
:root{--bg:#0e0e0c;--fg:#f1ede4;--acc:#ff5a36}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
.gap{height:80vh;display:grid;place-items:center;font:500 .8rem ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:3rem;padding:10vh 6vw}
.stat small{display:block;margin-top:.8rem;color:#8b877c;font-size:1rem}
.odo{display:flex;align-items:flex-start;font-size:clamp(3rem,9vw,6.5rem);font-weight:600;letter-spacing:-.04em;line-height:1;height:1em}
.col{display:block;height:1em;overflow:hidden}
.reel{display:block;transition:transform var(--d,1.6s) cubic-bezier(.16,1,.3,1) var(--dl,0s)}
.reel b{display:block;height:1em;font-weight:inherit;text-align:center}
.sym{height:1em}
.odo .sfx{color:var(--acc)}
</style>
</head>
<body>
<div class="gap">Scroll ↓</div>
<section class="stats">
  <div class="stat"><div class="odo" data-value="12480" data-suffix=""></div><small>Deployments shipped</small></div>
  <div class="stat"><div class="odo" data-value="99" data-suffix="%"></div><small>Uptime this year</small></div>
  <div class="stat"><div class="odo" data-value="350" data-prefix="$" data-suffix="K"></div><small>Saved with FinOps</small></div>
</section>
<div class="gap">Fin</div>
<script>
(function(){
  var CONFIG={dur:1.6,stagger:.12};
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var odos=[].slice.call(document.querySelectorAll(".odo"));
  function sym(txt,cls){var s=document.createElement("span");s.className="sym "+(cls||"");s.textContent=txt;s.setAttribute("aria-hidden","true");return s}
  odos.forEach(function(el){
    var v=el.dataset.value,fmt=Number(v).toLocaleString("en-US");
    el.setAttribute("role","img");el.setAttribute("aria-label",(el.dataset.prefix||"")+fmt+(el.dataset.suffix||""));
    if(el.dataset.prefix)el.appendChild(sym(el.dataset.prefix));
    var reels=[];
    fmt.split("").forEach(function(ch){
      if(!/\d/.test(ch)){el.appendChild(sym(ch));return}
      var col=document.createElement("span");col.className="col";col.setAttribute("aria-hidden","true");
      var reel=document.createElement("span");reel.className="reel";
      for(var d=0;d<10;d++){var b=document.createElement("b");b.textContent=d;reel.appendChild(b)}
      col.appendChild(reel);el.appendChild(col);reels.push([reel,+ch]);
    });
    if(el.dataset.suffix)el.appendChild(sym(el.dataset.suffix,"sfx"));
    el._reels=reels;
    reels.forEach(function(r,i){
      r[0].style.setProperty("--d",CONFIG.dur+"s");r[0].style.setProperty("--dl",(i*CONFIG.stagger)+"s");
      if(reduce){r[0].style.transition="none";r[0].style.transform="translateY(-"+r[1]+"em)"}
    });
  });
  if(reduce)return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      e.target._reels.forEach(function(r){r[0].style.transform="translateY(-"+r[1]+"em)"});
      io.unobserve(e.target);
    });
  },{threshold:.6});
  odos.forEach(function(o){io.observe(o)});
})();
</script>
</body>
</html>
