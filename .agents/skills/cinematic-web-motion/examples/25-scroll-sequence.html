<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll sequence demo</title>
<!-- Runs without assets: generates procedural frames. Replace makeFrames() with real image loading (see comment). -->
<style>
*{margin:0;box-sizing:border-box}body{background:#0b0b0c;color:#fff;font-family:system-ui,sans-serif}
.spacer{height:80vh;display:grid;place-items:center;font-size:clamp(2rem,6vw,5rem);font-weight:800}
.stage{height:100vh;position:relative;overflow:clip}canvas{position:absolute;inset:0;width:100%;height:100%}
.copy{position:absolute;max-width:26rem;font:italic 1.6rem Georgia,serif;opacity:0}
.c1{left:6vw;bottom:10vh}.c2{right:6vw;bottom:10vh;text-align:right}.c3{left:6vw;top:14vh}
#loader{position:fixed;inset:0;background:#0b0b0c;display:grid;place-items:center;z-index:9;transition:opacity .6s}
</style></head><body>
<div id="loader">Loading <span id="pct">0</span>%</div>
<section class="spacer">Scroll ↓</section>
<section class="stage"><canvas id="cv"></canvas>
<p class="copy c1">Every great evening starts with one clean strike.</p>
<p class="copy c2">Courts built for long rallies and late finishes.</p>
<p class="copy c3">Live availability, in 30-minute steps.</p></section>
<section class="spacer">The end</section>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis=new Lenis({duration:1.15});lenis.on('scroll',ScrollTrigger.update);
gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=120, frames=[], seq={frame:0};
function size(){const d=Math.min(devicePixelRatio,2);cv.width=innerWidth*d;cv.height=innerHeight*d;render()}
addEventListener('resize',size);

/* REAL ASSETS: replace with
   for(i=0;i<N;i++){const im=new Image();im.src=`frames/c1_${String(i+1).padStart(4,'0')}.webp`;im.onload=()=>{loaded++;...};frames.push(im)}
*/
function makeFrames(){ // procedural stand-in: ball flying toward camera
  for(let i=0;i<N;i++){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d'),p=i/(N-1);
    const bg=g.createRadialGradient(480,270,50,480,270,600);bg.addColorStop(0,'#133A27');bg.addColorStop(1,'#070B09');g.fillStyle=bg;g.fillRect(0,0,960,540);
    const r=20+p*p*320,x=480+Math.sin(p*6)*160*(1-p),y=300-p*60;
    const b=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);b.addColorStop(0,'#F4FF8A');b.addColorStop(1,'#A8D800');
    g.fillStyle=b;g.beginPath();g.arc(x,y,r,0,7);g.fill();frames.push(c)}
  document.getElementById('pct').textContent=100;
}
function render(){const im=frames[Math.round(seq.frame)];if(!im)return;
  const w=im.width,h=im.height,s=Math.max(cv.width/w,cv.height/h);
  ctx.drawImage(im,(cv.width-w*s)/2,(cv.height-h*s)/2,w*s,h*s)}
makeFrames();size();
document.getElementById('loader').style.opacity=0;setTimeout(()=>loader.remove(),700);

const tl=gsap.timeline({scrollTrigger:{trigger:'.stage',start:'top top',end:'+=4000',pin:true,scrub:.6}});
tl.to(seq,{frame:N-1,ease:'none',duration:10,snap:'frame',onUpdate:render},0);
[['.c1',.5,3],['.c2',3.8,6.5],['.c3',7,9.5]].forEach(([s,a,b])=>
  tl.fromTo(s,{opacity:0,y:30},{opacity:1,y:0,duration:.8},a).to(s,{opacity:0,duration:.8},b));
if(matchMedia('(prefers-reduced-motion: reduce)').matches){ScrollTrigger.getAll().forEach(t=>t.kill());seq.frame=N-1;render();document.querySelectorAll('.copy').forEach(e=>e.style.opacity=1)}
</script></body></html>
