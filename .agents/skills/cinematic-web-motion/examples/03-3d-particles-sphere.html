<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Particles Morph</title>
<!--
  EFFECT: ~14k particles form a sphere and morph (GSAP-driven blend) to a torus and to text sampled from a
  2D canvas. The mouse repels nearby particles (CPU physics in world space on the z=0 plane); particles spring back.
  ADAPT: change COUNT, TEXT, colours, REPEL_RADIUS/REPEL_FORCE, SPRING. Add a target by pushing another
  Float32Array into TARGETS and a button in the nav.
  Reduced motion: no auto-cycle, no idle drift/repel; shapes switch instantly on click.
-->
<style>
  html,body{margin:0;height:100%;background:#050507;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;display:block}
  .ui{position:fixed;bottom:5vh;left:0;right:0;display:flex;gap:.6rem;justify-content:center}
  button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#ddd;padding:.7rem 1.3rem;border-radius:99px;
    font:inherit;letter-spacing:.15em;text-transform:uppercase;font-size:.7rem;cursor:pointer;transition:.25s}
  button:hover,button.on{background:#fff;color:#000}
  .t{position:fixed;top:5vh;left:0;right:0;text-align:center;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#8a8a99}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<div class="t">Particles / morph — move the cursor through them</div>
<div class="ui"><button data-i="0" class="on">Sphere</button><button data-i="1">Torus</button><button data-i="2">Text</button></div>
<script type="module">
import * as THREE from 'three';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COUNT = 14000, TEXT = 'MOTION', REPEL_RADIUS = 1.1, REPEL_FORCE = .22, SPRING = .06;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,.1,100); camera.position.z = 9;

// ---- targets
function sphere(){const a=new Float32Array(COUNT*3);for(let i=0;i<COUNT;i++){
  const u=Math.random()*2-1,t=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u)*2.2;
  a.set([r*Math.cos(t),u*2.2,r*Math.sin(t)],i*3);}return a;}
function torus(){const a=new Float32Array(COUNT*3);for(let i=0;i<COUNT;i++){
  const u=Math.random()*Math.PI*2,v=Math.random()*Math.PI*2,R=2.2,r=.75;
  a.set([(R+r*Math.cos(v))*Math.cos(u),r*Math.sin(v)*1.2,(R+r*Math.cos(v))*Math.sin(u)*.5],i*3);}return a;}
function text(){
  const c=document.createElement('canvas'),W=900,H=300;c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#fff';x.font='900 230px Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(TEXT,W/2,H/2);
  const d=x.getImageData(0,0,W,H).data,pts=[];
  for(let y=0;y<H;y+=2)for(let xx=0;xx<W;xx+=2)if(d[(y*W+xx)*4+3]>128)pts.push([(xx/W-.5)*8.5,-(y/H-.5)*2.9]);
  const a=new Float32Array(COUNT*3);
  for(let i=0;i<COUNT;i++){const p=pts[i%pts.length];a.set([p[0]+(Math.random()-.5)*.03,p[1]+(Math.random()-.5)*.03,(Math.random()-.5)*.3],i*3);}
  return a;}
const TARGETS=[sphere(),torus(),text()];

// ---- geometry
const pos = new Float32Array(TARGETS[0]);
const vel = new Float32Array(COUNT*3);
const from = new Float32Array(TARGETS[0]);
const col = new Float32Array(COUNT*3);
const c1=new THREE.Color('#7c6cff'),c2=new THREE.Color('#2ee6d6'),tc=new THREE.Color();
for(let i=0;i<COUNT;i++){tc.copy(c1).lerp(c2,Math.random());col.set([tc.r,tc.g,tc.b],i*3);}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.9,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
scene.add(pts);

// ---- morph
const blend={t:1}; let current=0;
const base=new Float32Array(TARGETS[0]); // interpolated home positions
function morphTo(i){
  if(i===current)return; const prev=base.slice(); const nxt=TARGETS[i]; current=i;
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  if(reduce){base.set(nxt);frame();return;}
  blend.t=0;
  gsap.to(blend,{t:1,duration:1.8,ease:'power3.inOut',onUpdate(){
    const k=blend.t; for(let j=0;j<base.length;j++)base[j]=prev[j]+(nxt[j]-prev[j])*k;}});
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{morphTo(+b.dataset.i);auto=false;});
let auto=!reduce; if(auto)setInterval(()=>{if(auto)morphTo((current+1)%3)},5000);

// ---- mouse in world (z=0 plane)
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(9,9),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3(1e3,1e3,1e3);
addEventListener('pointermove',e=>{ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);});
addEventListener('pointerleave',()=>hit.set(1e3,1e3,1e3));

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;
  camera.position.z = w/h<1 ? 9/Math.max(w/h,.5)*.8+2 : 9; camera.updateProjectionMatrix(); if(reduce)frame();}
addEventListener('resize',resize);

function frame(){
  if(!reduce){
    ray.setFromCamera(ndc,camera); if(!ray.ray.intersectPlane(plane,hit))hit.set(1e3,1e3,1e3);
  }
  const hx=hit.x,hy=hit.y,R2=REPEL_RADIUS*REPEL_RADIUS;
  for(let i=0;i<COUNT;i++){
    const k=i*3;
    if(reduce){pos[k]=base[k];pos[k+1]=base[k+1];pos[k+2]=base[k+2];continue;}
    const dx=pos[k]-hx,dy=pos[k+1]-hy,d2=dx*dx+dy*dy;
    if(d2<R2){const d=Math.sqrt(d2)+1e-4,f=(1-d/REPEL_RADIUS)*REPEL_FORCE;vel[k]+=dx/d*f;vel[k+1]+=dy/d*f;vel[k+2]+=(Math.random()-.5)*f;}
    vel[k]+=(base[k]-pos[k])*SPRING;vel[k+1]+=(base[k+1]-pos[k+1])*SPRING;vel[k+2]+=(base[k+2]-pos[k+2])*SPRING;
    vel[k]*=.86;vel[k+1]*=.86;vel[k+2]*=.86;
    pos[k]+=vel[k];pos[k+1]+=vel[k+1];pos[k+2]+=vel[k+2];
  }
  geo.attributes.position.needsUpdate=true;
  // gentle drift of whole cloud only for non-text shapes (keeps repel mapping approximately valid)
  pts.rotation.y = (!reduce && current!==2) ? Math.sin(performance.now()*.0003)*.25 : 0;
  renderer.render(scene,camera);
}
resize();
if(reduce)frame(); else renderer.setAnimationLoop(frame);
</script>
</body>
</html>
