<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volumetric Light Rays</title>
<!--
  EFFECT: Volumetric god-rays emanating from a point above the viewport, drawn in a WebGL fragment shader.
  Angular noise-modulated beams fade with distance; the origin gently follows the cursor.
  ADAPT: change RAY_COLOR (rgb 0-1), ORIGIN (uv, y>1 is above screen), DENSITY, SPEED, LENGTH (falloff),
  FOLLOW (mouse sway amount). Place canvas behind content; it uses additive-style output on dark bg.
  Reduced motion: one static frame, no mouse sway.
  Resize: canvas tracks window size and devicePixelRatio (capped at 1.5 for perf).
-->
<style>
  html,body{margin:0;height:100%;background:#050507;color:#eee9de;font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  main{position:relative;height:100%;display:grid;place-content:center;text-align:center;padding:2rem}
  h1{margin:0;font-weight:200;font-size:clamp(2.4rem,7vw,5.5rem);letter-spacing:-.03em}
  p{margin:1rem 0 0;opacity:.6;font-size:.95rem;letter-spacing:.08em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main><h1>Let there be light</h1><p>Volumetric rays · WebGL</p></main>
<script>
(() => {
  const RAY_COLOR=[1.0,0.82,0.55], ORIGIN=[0.5,1.25], DENSITY=1.0, SPEED=0.25, LENGTH=1.1, FOLLOW=0.25;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=document.getElementById('c');
  const gl=canvas.getContext('webgl');
  if(!gl){document.body.style.background='radial-gradient(ellipse at 50% -20%,#6b5330,#050507 70%)';return;}
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision highp float;
  uniform vec2 uRes,uOrigin;uniform float uTime,uDensity,uLen;uniform vec3 uCol;
  float hash(float n){return fract(sin(n)*43758.5453);}
  float noise(float x){float i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(hash(i),hash(i+1.),f);}
  float rays(vec2 d,float t,float seed,float freq,float spd){
    float a=atan(d.x,-d.y);
    float n=noise(a*freq+seed+t*spd)*.6+noise(a*freq*2.3-seed-t*spd*1.7)*.4;
    return smoothstep(.35,.95,n);
  }
  void main(){
    vec2 uv=gl_FragCoord.xy/uRes;
    float asp=uRes.x/uRes.y;
    vec2 d=(uv-uOrigin)*vec2(asp,1.);
    float dist=length(d);
    float fall=exp(-dist/uLen*1.6);
    float r=rays(d,uTime,1.,9.,.6)*.6+rays(d,uTime,5.,17.,-.4)*.4;
    float core=exp(-dist*3.)*.7;
    float v=(r*fall*uDensity+core);
    v*=smoothstep(0.,.35,uv.y+.2);
    vec3 col=uCol*v;
    col+=vec3(.02,.025,.05)*(1.-uv.y);
    float g=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
    col+=(g-.5)*.02;
    gl_FragColor=vec4(col,1.);
  }`;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  const uRes=U('uRes'),uOrigin=U('uOrigin'),uTime=U('uTime');
  gl.uniform3fv(U('uCol'),new Float32Array(RAY_COLOR));
  gl.uniform1f(U('uDensity'),DENSITY);gl.uniform1f(U('uLen'),LENGTH);
  let ox=ORIGIN[0],tx=ORIGIN[0];
  if(!reduce)addEventListener('pointermove',e=>{tx=ORIGIN[0]+(e.clientX/innerWidth-.5)*FOLLOW*2;});
  function draw(now){
    ox+=(tx-ox)*.05;
    gl.uniform2f(uOrigin,ox,ORIGIN[1]);
    gl.uniform1f(uTime,reduce?3:now*.001*SPEED*4);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  function resize(){
    const d=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);
    gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(uRes,canvas.width,canvas.height);
    if(reduce)draw(0);
  }
  addEventListener('resize',resize);resize();
  if(!reduce){const loop=t=>{draw(t);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
})();
</script>
</body>
</html>
