<!--
  Effect: 3D Apartment Walkthrough ("HALF light" / @michonmotion inspired)
  - Real-time Three.js architectural scene: misty dusk exterior -> glass facade -> Lounge -> Kitchen -> Suite.
  - Scroll (or click "Enter") dollies the 3D camera from exterior right through the glass wall into the living room.
  - Room pill buttons in the bottom-left frosted glass card glide the camera smoothly between rooms, with subtle mouse-look parallax.
  - Adapt: swap procedural Three.js room meshes for a single exported architectural GLB/GLTF or gaussian splat, keeping the camera waypoints & UI card.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Apartment Walkthrough — HALF light</title>
<style>
  :root {
    --ink: #f4f1ea;
    --muted: rgba(244, 241, 234, 0.72);
    --glass: rgba(18, 20, 22, 0.46);
    --border: rgba(255, 255, 255, 0.16);
    --cream: #efe6d5;
    --dark: #141517;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0e1114; color: var(--ink); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  #webgl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* Subtle vignette */
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(8,10,12,0.58) 100%);
  }

  /* Floating top pill navbar */
  .topbar {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 6px; padding: 6px;
    background: var(--glass); backdrop-filter: blur(18px) saturate(1.2);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .topbar button {
    border: 0; background: transparent; color: var(--ink); cursor: pointer;
    padding: 8px 16px; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
    transition: background 0.25s, color 0.25s;
  }
  .topbar button.active { background: var(--cream); color: var(--dark); font-weight: 600; }
  .topbar button:hover:not(.active) { background: rgba(255,255,255,0.08); }

  /* Hero title overlay (fades out as you enter through glass) */
  .hero-title {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .hero-title.hidden { opacity: 0; transform: translateY(-20px) scale(0.97); }
  .hero-title h1 {
    font-size: clamp(3.5rem, 12vw, 9.5rem); font-weight: 800; letter-spacing: 0.08em;
    line-height: 0.9; color: #e9dfd0; text-transform: uppercase;
    text-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .hero-title em {
    display: block; font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-weight: 400; font-size: clamp(2rem, 5.5vw, 4.4rem); letter-spacing: 0.02em;
    color: #ffffff; margin-top: -0.15em;
  }
  .scroll-cue {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 999px;
    background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--border);
    font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream);
    cursor: pointer; transition: opacity 0.4s, transform 0.3s;
  }
  .scroll-cue:hover { transform: translateX(-50%) translateY(-2px); }
  .scroll-cue.hidden { opacity: 0; pointer-events: none; }

  /* Bottom-left frosted glass room card */
  .room-card {
    position: fixed; left: 28px; bottom: 28px; z-index: 8;
    width: min(390px, calc(100vw - 56px)); padding: 22px 24px;
    background: var(--glass); backdrop-filter: blur(22px) saturate(1.25);
    border: 1px solid var(--border); border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(.2,.7,.2,1);
  }
  .room-card.hidden { opacity: 0; transform: translateY(18px); pointer-events: none; }
  .room-eyebrow {
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: #e8b878; margin-bottom: 6px;
  }
  .room-card h2 {
    font-family: Georgia, serif; font-weight: 400; font-size: 1.85rem;
    margin-bottom: 8px; transition: opacity 0.25s;
  }
  .room-card p {
    font-size: 0.88rem; line-height: 1.5; color: var(--muted); margin-bottom: 16px;
  }
  .room-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .room-pills button {
    border: 1px solid var(--border); background: rgba(255,255,255,0.06);
    color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 0.8rem;
    cursor: pointer; transition: all 0.22s;
  }
  .room-pills button.active { background: var(--cream); color: var(--dark); border-color: var(--cream); font-weight: 600; }
  .room-pills button:hover:not(.active) { background: rgba(255,255,255,0.14); }

  @media (max-width: 640px) {
    .room-card { left: 16px; bottom: 16px; width: calc(100vw - 32px); padding: 18px; }
    .topbar { top: 12px; max-width: calc(100vw - 24px); overflow-x: auto; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="webgl" aria-hidden="true"></canvas>
<div class="vignette"></div>

<nav class="topbar" aria-label="Room navigation">
  <button data-room="exterior" class="active">Exterior</button>
  <button data-room="lounge">The Lounge</button>
  <button data-room="kitchen">The Kitchen</button>
  <button data-room="suite">The Suite</button>
</nav>

<div class="hero-title" id="heroTitle">
  <h1>HALF<em>light</em></h1>
</div>

<button class="scroll-cue" id="scrollCue">Scroll or click to enter through the glass ↓</button>

<aside class="room-card hidden" id="roomCard" aria-live="polite">
  <div class="room-eyebrow" id="roomEyebrow">01 · LIVING SPACE</div>
  <h2 id="roomName">The lounge</h2>
  <p id="roomDesc">Floor-to-ceiling glass frames the misty ridge while warm cedar and hearth light anchor the room.</p>
  <div class="room-pills">
    <button data-room="lounge" class="active">The lounge</button>
    <button data-room="kitchen">The kitchen</button>
    <button data-room="suite">The suite</button>
    <button data-room="exterior">Outside</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="module">
import * as THREE from 'three';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#27323b');
scene.fog = new THREE.FogExp2('#27323b', 0.032);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);

// Materials
const darkWood = new THREE.MeshStandardMaterial({ color: '#241c17', roughness: 0.72, metalness: 0.05 });
const warmFloor = new THREE.MeshStandardMaterial({ color: '#3b2c22', roughness: 0.55, metalness: 0.08 });
const slateWall = new THREE.MeshStandardMaterial({ color: '#1b1e22', roughness: 0.85 });
const fabricSofa = new THREE.MeshStandardMaterial({ color: '#33363b', roughness: 0.92 });
const linenMat = new THREE.MeshStandardMaterial({ color: '#dfd6c7', roughness: 0.9 });
const brassMat = new THREE.MeshStandardMaterial({ color: '#d4a36a', roughness: 0.28, metalness: 0.85 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: '#b8d4e3', transparent: true, opacity: 0.18, roughness: 0.06, metalness: 0.1,
  transmission: 0.65, side: THREE.DoubleSide
});

// Exterior misty ground + distant mountain silhouettes
const hill = new THREE.Mesh(new THREE.PlaneGeometry(80, 80, 24, 24), new THREE.MeshStandardMaterial({ color: '#232e29', roughness: 0.95 }));
hill.rotation.x = -Math.PI / 2;
hill.position.y = -0.05;
scene.add(hill);

// Apartment structure (X: -10 to +10, Z: -12 to +2)
const apt = new THREE.Group();
scene.add(apt);

const floor = new THREE.Mesh(new THREE.BoxGeometry(18, 0.2, 12), warmFloor);
floor.position.set(0, 0, -4);
floor.receiveShadow = true;
apt.add(floor);

const ceiling = new THREE.Mesh(new THREE.BoxGeometry(18.4, 0.25, 12.4), darkWood);
ceiling.position.set(0, 4.1, -4);
apt.add(ceiling);

// Back wall + side walls
const backWall = new THREE.Mesh(new THREE.BoxGeometry(18, 4, 0.25), slateWall);
backWall.position.set(0, 2, -10);
apt.add(backWall);

const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4, 12), slateWall);
leftWall.position.set(-9, 2, -4);
apt.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4, 12), slateWall);
rightWall.position.set(9, 2, -4);
apt.add(rightWall);

// Front glass facade with slim dark mullions (Z = 2)
const glassFacade = new THREE.Mesh(new THREE.PlaneGeometry(17.6, 3.9), glassMat);
glassFacade.position.set(0, 2.05, 2);
apt.add(glassFacade);
for (let x = -8.5; x <= 8.5; x += 3.4) {
  const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.09, 4, 0.14), slateWall);
  mullion.position.set(x, 2, 2);
  apt.add(mullion);
}

// Interior partition walls (with wide open doorways so camera glides through cleanly)
const div1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 5.5), darkWood);
div1.position.set(-2.5, 2, -7.2);
apt.add(div1);

const div2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 5.5), darkWood);
div2.position.set(3.2, 2, -7.2);
apt.add(div2);

// --- ROOM 1: THE LOUNGE (Center-Left: X -6 to -2, Z -5 to 0) ---
const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.45, 1.3), fabricSofa);
sofaBase.position.set(-5.6, 0.35, -3.5);
sofaBase.castShadow = true;
apt.add(sofaBase);
const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.65, 0.28), fabricSofa);
sofaBack.position.set(-5.6, 0.78, -4.05);
apt.add(sofaBack);
const coffeeTable = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.08, 28), darkWood);
coffeeTable.position.set(-5.5, 0.42, -1.6);
apt.add(coffeeTable);

// Glowing hearth / stove
const hearth = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.45, 1.4, 20), slateWall);
hearth.position.set(-7.6, 0.8, -1.5);
apt.add(hearth);
const ember = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshBasicMaterial({ color: '#ff7b29' }));
ember.position.set(-7.5, 0.58, -1.45);
apt.add(ember);
const hearthLight = new THREE.PointLight('#ff7e33', 7, 9);
hearthLight.position.set(-7.2, 0.8, -1.2);
apt.add(hearthLight);

// --- ROOM 2: THE KITCHEN (Center: X -1.5 to +2.8, Z -8 to -2) ---
const island = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.92, 1.15), slateWall);
island.position.set(0.4, 0.55, -5.2);
island.castShadow = true;
apt.add(island);
const islandTop = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.06, 1.25), linenMat);
islandTop.position.set(0.4, 1.03, -5.2);
apt.add(islandTop);
const pendant = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.22, 24, 1, true), brassMat);
pendant.position.set(0.4, 2.55, -5.2);
apt.add(pendant);
const pendantCord = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.5, 8), slateWall);
pendantCord.position.set(0.4, 3.35, -5.2);
apt.add(pendantCord);
const kitchenLight = new THREE.PointLight('#ffbe78', 8, 10);
kitchenLight.position.set(0.4, 2.3, -5.2);
apt.add(kitchenLight);

// --- ROOM 3: THE SUITE (Right: X +3.8 to +8.5, Z -8 to -1) ---
const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.4, 2.6), darkWood);
bedBase.position.set(6.2, 0.3, -6.2);
apt.add(bedBase);
const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.28, 2.45), linenMat);
mattress.position.set(6.2, 0.62, -6.2);
apt.add(mattress);
const tub = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 0.95, 10, 20), linenMat);
tub.rotation.z = Math.PI / 2;
tub.position.set(6.4, 0.45, -1.6);
apt.add(tub);
const suiteLight = new THREE.PointLight('#ffaa5e', 7.5, 10);
suiteLight.position.set(6.2, 2.1, -5.4);
apt.add(suiteLight);

// Ambient dusk light
scene.add(new THREE.HemisphereLight('#8aa3b8', '#221c18', 0.9));
const dirLight = new THREE.DirectionalLight('#b9cfe0', 0.85);
dirLight.position.set(4, 9, 10);
scene.add(dirLight);

// Camera waypoints
const ROOMS = {
  exterior: {
    pos: new THREE.Vector3(-3.8, 1.85, 8.8),
    look: new THREE.Vector3(-4.2, 1.55, -2.5),
    eyebrow: 'EXTERIOR', title: 'HALF light',
    desc: 'Perched above the misty valley. Scroll or choose a room to step through the glass.'
  },
  lounge: {
    pos: new THREE.Vector3(-4.5, 1.45, -0.4),
    look: new THREE.Vector3(-6.2, 1.0, -3.5),
    eyebrow: '01 · LIVING SPACE', title: 'The lounge',
    desc: 'Floor-to-ceiling glass frames the misty ridge while warm cedar and hearth light anchor the room.'
  },
  kitchen: {
    pos: new THREE.Vector3(-1.4, 1.55, -2.1),
    look: new THREE.Vector3(0.5, 1.1, -5.3),
    eyebrow: '02 · DINING & HEARTH', title: 'The kitchen',
    desc: 'Monolithic stone island beneath brushed brass pendants, open to the evening horizon.'
  },
  suite: {
    pos: new THREE.Vector3(3.9, 1.5, -1.2),
    look: new THREE.Vector3(6.2, 0.9, -5.8),
    eyebrow: '03 · PRIVATE SANCTUARY', title: 'The suite',
    desc: 'Timber walls, linen bedding, and a freestanding soaking tub facing the glass facade.'
  }
};

const camState = {
  px: ROOMS.exterior.pos.x, py: ROOMS.exterior.pos.y, pz: ROOMS.exterior.pos.z,
  lx: ROOMS.exterior.look.x, ly: ROOMS.exterior.look.y, lz: ROOMS.exterior.look.z
};
let currentRoom = 'exterior';
let pointer = { x: 0, y: 0 };

function goToRoom(key) {
  if (!ROOMS[key]) return;
  currentRoom = key;
  const r = ROOMS[key];
  const dur = reduced ? 0 : 1.75;
  gsap.to(camState, {
    px: r.pos.x, py: r.pos.y, pz: r.pos.z,
    lx: r.look.x, ly: r.look.y, lz: r.look.z,
    duration: dur, ease: 'power3.inOut'
  });

  // Sync UI
  document.querySelectorAll('[data-room]').forEach(b => b.classList.toggle('active', b.dataset.room === key));
  const isExt = key === 'exterior';
  document.getElementById('heroTitle').classList.toggle('hidden', !isExt);
  document.getElementById('scrollCue').classList.toggle('hidden', !isExt);
  document.getElementById('roomCard').classList.toggle('hidden', isExt);
  if (!isExt) {
    document.getElementById('roomEyebrow').textContent = r.eyebrow;
    document.getElementById('roomName').textContent = r.title;
    document.getElementById('roomDesc').textContent = r.desc;
  }
}

document.querySelectorAll('[data-room]').forEach(btn => {
  btn.addEventListener('click', () => goToRoom(btn.dataset.room));
});
document.getElementById('scrollCue').addEventListener('click', () => goToRoom('lounge'));

// Wheel navigation between rooms
const ORDER = ['exterior', 'lounge', 'kitchen', 'suite'];
let wheelLock = false;
addEventListener('wheel', (e) => {
  if (wheelLock || Math.abs(e.deltaY) < 12) return;
  const idx = ORDER.indexOf(currentRoom);
  const nextIdx = Math.max(0, Math.min(ORDER.length - 1, idx + (e.deltaY > 0 ? 1 : -1)));
  if (nextIdx !== idx) {
    wheelLock = true;
    goToRoom(ORDER[nextIdx]);
    setTimeout(() => { wheelLock = false; }, 950);
  }
}, { passive: true });

addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth - 0.5) * 2;
  pointer.y = (e.clientY / innerHeight - 0.5) * 2;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let smoothX = 0, smoothY = 0;
function animate(t) {
  requestAnimationFrame(animate);
  if (!reduced) {
    smoothX += (pointer.x * 0.28 - smoothX) * 0.05;
    smoothY += (pointer.y * 0.14 - smoothY) * 0.05;
    hearthLight.intensity = 6.5 + Math.sin(t * 0.008) * 0.8;
  }
  camera.position.set(camState.px + smoothX, camState.py - smoothY, camState.pz);
  camera.lookAt(camState.lx, camState.ly, camState.lz);
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
