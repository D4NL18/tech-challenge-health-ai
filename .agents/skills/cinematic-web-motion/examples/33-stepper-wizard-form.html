<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>33 · Stepper Wizard Form</title>
<!--
  PATTERN: Multi-step wizard with a progress stepper, per-step validation, direction-aware panel slide and a
           review summary. Completed steps are clickable to go back.
  Motion: panels translate 16px + fade in 180ms in the direction of travel (forward from right, back from left);
          progress connector fills with a 200ms scaleX transition; invalid fields shake once (160ms).
  Accessibility: stepper is an ordered list with aria-current="step"; each panel is a <fieldset> with legend; the
          heading of the new step receives focus on change; errors use aria-invalid + aria-describedby and an
          aria-live summary; Enter submits the step; all controls are native. prefers-reduced-motion disables
          slide, fill and shake.
  Adapting: add steps by adding <fieldset class="panel"> and a stepper <li>; put per-step rules in VALIDATORS.
-->
<style>
  :root { --bg:#fafafa; --surface:#fff; --fg:#18181b; --mut:#71717a; --bd:rgba(0,0,0,.08); --bd2:rgba(0,0,0,.2);
    --acc:#4f46e5; --err:#dc2626; --hover:#f4f4f5; --shadow:0 6px 24px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#09090b; --surface:#18181b; --fg:#fafafa; --mut:#a1a1aa; --bd:rgba(255,255,255,.10); --bd2:rgba(255,255,255,.24);
      --acc:#818cf8; --err:#f87171; --hover:#27272a; --shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:start center; padding:8vh 1rem; background:var(--bg); color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { width:min(520px,100%); background:var(--surface); border:1px solid var(--bd); border-radius:14px; box-shadow:var(--shadow); padding:24px; overflow:hidden; }
  ol.steps { list-style:none; display:flex; margin-bottom:24px; }
  ol.steps li { flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--mut); font-size:12px; }
  ol.steps li::before { content:""; position:absolute; top:13px; right:50%; width:100%; height:2px; background:var(--bd2); z-index:0; }
  ol.steps li::after { content:""; position:absolute; top:13px; right:50%; width:100%; height:2px; background:var(--acc); z-index:0;
    transform:scaleX(0); transform-origin:right; transition:transform 200ms ease; }
  ol.steps li:first-child::before, ol.steps li:first-child::after { display:none; }
  ol.steps li.done::after, ol.steps li.current::after { transform:scaleX(1); }
  .dot { position:relative; z-index:1; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--surface);
    border:2px solid var(--bd2); font-weight:600; font-size:12px; color:inherit; cursor:default; transition:background 150ms, border-color 150ms; }
  li.current .dot { border-color:var(--acc); color:var(--fg); }
  li.current { color:var(--fg); }
  li.done .dot { background:var(--acc); border-color:var(--acc); color:#fff; cursor:pointer; }
  fieldset.panel { border:0; display:none; }
  fieldset.panel.active { display:grid; gap:14px; animation:slide 180ms ease-out; }
  .panel.back { --from:-16px; }
  @keyframes slide { from { opacity:0; transform:translateX(var(--from,16px)); } to { opacity:1; transform:none; } }
  legend { font-size:16px; font-weight:600; margin-bottom:12px; outline:0; }
  .f { display:grid; gap:4px; }
  .f label { font-weight:500; }
  .f input, .f select { padding:8px 10px; border:1px solid var(--bd2); border-radius:8px; background:var(--surface); color:var(--fg); font:inherit; }
  .f input[aria-invalid=true] { border-color:var(--err); animation:shake 160ms; }
  .err { color:var(--err); font-size:12px; min-height:0; }
  @keyframes shake { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .plans { display:grid; gap:8px; }
  .plan { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--bd2); border-radius:10px; cursor:pointer; }
  .plan:has(input:checked) { border-color:var(--acc); background:var(--hover); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; }
  dt { color:var(--mut); }
  .actions { display:flex; justify-content:space-between; margin-top:20px; }
  button.b { padding:8px 16px; border-radius:8px; border:1px solid var(--bd2); background:var(--surface); color:var(--fg); font:inherit; cursor:pointer; }
  button.b:hover { background:var(--hover); }
  button.b.primary { background:var(--fg); color:var(--bg); border-color:transparent; }
  button.b[hidden] { display:none; }
  .ok { text-align:center; padding:24px 0; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<form class="card" id="form" novalidate>
  <ol class="steps" id="steps" aria-label="Progress">
    <li><span class="dot">1</span>Account</li>
    <li><span class="dot">2</span>Plan</li>
    <li><span class="dot">3</span>Review</li>
  </ol>

  <fieldset class="panel">
    <legend tabindex="-1">Create your account</legend>
    <div class="f"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" aria-describedby="e-name"><span class="err" id="e-name"></span></div>
    <div class="f"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="e-email"><span class="err" id="e-email"></span></div>
  </fieldset>

  <fieldset class="panel">
    <legend tabindex="-1">Choose a plan</legend>
    <div class="plans" role="radiogroup" aria-label="Plan">
      <label class="plan"><input type="radio" name="plan" value="Hobby — Free" checked> <span><b>Hobby</b> · Free</span></label>
      <label class="plan"><input type="radio" name="plan" value="Pro — $12/mo"> <span><b>Pro</b> · $12/mo</span></label>
      <label class="plan"><input type="radio" name="plan" value="Team — $29/mo"> <span><b>Team</b> · $29/mo</span></label>
    </div>
    <div class="f"><label for="seats">Seats</label><input id="seats" name="seats" type="number" min="1" max="50" value="1" aria-describedby="e-seats"><span class="err" id="e-seats"></span></div>
  </fieldset>

  <fieldset class="panel">
    <legend tabindex="-1">Review and confirm</legend>
    <dl id="summary"></dl>
  </fieldset>

  <div class="ok" id="ok" hidden><b>You are all set.</b><p style="color:var(--mut)">Confirmation sent.</p></div>

  <div class="actions" id="actions">
    <button type="button" class="b" id="back" hidden>Back</button>
    <button type="submit" class="b primary" id="next" style="margin-left:auto">Continue</button>
  </div>
  <div class="sr" role="status" aria-live="polite" id="live"></div>
</form>
<script>
(function () {
  var form = document.getElementById('form');
  var panels = [].slice.call(form.querySelectorAll('.panel'));
  var items = [].slice.call(document.getElementById('steps').children);
  var back = document.getElementById('back'), next = document.getElementById('next'), live = document.getElementById('live');
  var step = 0, max = 0;

  var VALIDATORS = [
    function () {
      var e = {}, n = form.name.value.trim(), m = form.email.value.trim();
      if (n.length < 2) e.name = 'Enter your full name.';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) e.email = 'Enter a valid email address.';
      return e;
    },
    function () {
      var e = {}, s = +form.seats.value;
      if (!(s >= 1 && s <= 50) || s % 1) e.seats = 'Seats must be a whole number from 1 to 50.';
      return e;
    },
    function () { return {}; }
  ];

  function showErrors(errs) {
    ['name', 'email', 'seats'].forEach(function (k) {
      var inp = form[k], out = document.getElementById('e-' + k);
      if (!inp) return;
      var msg = errs[k] || '';
      out.textContent = msg;
      inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
    });
    var keys = Object.keys(errs);
    if (keys.length) { form[keys[0]].focus(); live.textContent = errs[keys[0]]; }
  }
  function summary() {
    document.getElementById('summary').innerHTML =
      '<dt>Name</dt><dd></dd><dt>Email</dt><dd></dd><dt>Plan</dt><dd></dd><dt>Seats</dt><dd></dd>';
    var dd = document.querySelectorAll('#summary dd');
    dd[0].textContent = form.name.value; dd[1].textContent = form.email.value;
    dd[2].textContent = form.plan.value; dd[3].textContent = form.seats.value;
  }
  function go(to, focus) {
    var dir = to < step ? 'back' : '';
    step = to; max = Math.max(max, step);
    panels.forEach(function (p, i) {
      p.classList.toggle('active', i === step); p.classList.toggle('back', dir === 'back');
    });
    items.forEach(function (li, i) {
      li.classList.toggle('done', i < step); li.classList.toggle('current', i === step);
      if (i === step) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
    });
    if (step === 2) summary();
    back.hidden = step === 0;
    next.textContent = step === panels.length - 1 ? 'Confirm' : 'Continue';
    live.textContent = 'Step ' + (step + 1) + ' of ' + panels.length + ': ' + panels[step].querySelector('legend').textContent;
    if (focus !== false) panels[step].querySelector('legend').focus();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var errs = VALIDATORS[step]();
    showErrors(errs);
    if (Object.keys(errs).length) return;
    if (step < panels.length - 1) return go(step + 1);
    panels[step].classList.remove('active');
    document.getElementById('actions').hidden = true;
    items.forEach(function (li) { li.classList.add('done'); li.classList.remove('current'); });
    var ok = document.getElementById('ok'); ok.hidden = false; live.textContent = 'Submitted. You are all set.';
  });
  back.addEventListener('click', function () { go(step - 1); });
  items.forEach(function (li, i) {
    li.addEventListener('click', function () { if (i < step) go(i); });
  });
  ['input', 'change'].forEach(function (ev) {
    form.addEventListener(ev, function (e) {
      if (e.target.getAttribute && e.target.getAttribute('aria-invalid') === 'true') showErrors(VALIDATORS[step]());
    });
  });
  go(0, false);
})();
</script>
</body>
</html>
