<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 Â· Magnetic Buttons Grid</title>
<!--
EFFECT: A grid of pill/square buttons that
  1) are magnetic â€” the button (and its inner label, with extra parallax) is pulled toward the
     pointer within a radius, then springs back with elastic ease (gsap.quickTo),
  2) fill on hover â€” a circular blob rises from the pointer's entry edge (clip via scaleY/ border-radius),
  3) swap arrows â€” the arrow slides out diagonally while a duplicate slides in.
HOW TO ADAPT:
  - Strength: data-strength="0.35" per button (fraction of pointer offset applied).
  - Fill colour: --fill on the button. Arrow glyph: edit the two .arr spans.
  - Works on keyboard focus (fill + arrow swap play on :focus-visible too).
REDUCED MOTION / TOUCH: magnet movement disabled; fill and arrow swap become instant colour changes via CSS.
-->
<style>
*{box-sizing:border-box;margin:0}
body{background:#f4f1ea;color:#171717;font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:6vh 5vw;-webkit-font-smoothing:antialiased}
h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.04em;margin-bottom:.6rem;font-weight:600}
.lead{color:#777;margin-bottom:3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2.5rem;width:min(1100px,100%)}
.cell{display:grid;place-items:center;padding:2.2rem;border:1px solid #0000001a;border-radius:18px;min-height:200px}
.btn{--fill:#171717;position:relative;display:inline-flex;align-items:center;gap:.8rem;padding:1.1rem 1.8rem;border-radius:999px;border:1.5px solid #171717;background:transparent;color:#171717;font:500 1rem/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer;overflow:hidden;isolation:isolate;will-change:transform}
.btn.sq{border-radius:10px}
.btn.round{width:130px;height:130px;padding:0;justify-content:center;border-radius:50%}
.fill{position:absolute;left:50%;top:100%;width:150%;aspect-ratio:1;border-radius:50%;background:var(--fill);transform:translate(-50%,0) scale(0);z-index:-1;pointer-events:none}
.label{display:inline-flex;align-items:center;gap:.7rem;transition:color .35s;will-change:transform}
.btn.on .label{color:#f4f1ea}
.arrow{position:relative;display:inline-block;width:1em;height:1em;overflow:hidden}
.arr{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
.arr.b{transform:translate(-110%,110%)}
.nomag .btn:hover .fill,.nomag .btn:focus-visible .fill{transform:translate(-50%,-50%) scale(1);top:50%}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Magnetic grid</h1>
  <p class="lead">Hover close. Tab through with the keyboard.</p>
  <div class="grid">
    <div class="cell"><a class="btn" href="#" data-strength=".35"><span class="label">Start project<span class="arrow"><span class="arr a">â†—</span><span class="arr b">â†—</span></span></span><span class="fill"></span></a></div>
    <div class="cell"><button class="btn sq" style="--fill:#ff5a36" data-strength=".3"><span class="label">Download<span class="arrow"><span class="arr a">â†“</span><span class="arr b">â†“</span></span></span><span class="fill"></span></button></div>
    <div class="cell"><a class="btn round" href="#" style="--fill:#2f6bff" data-strength=".5"><span class="label">Play<span class="arrow"><span class="arr a">â–¶</span><span class="arr b">â–¶</span></span></span><span class="fill"></span></a></div>
    <div class="cell"><a class="btn" href="#" style="--fill:#18b58a" data-strength=".4"><span class="label">Say hello<span class="arrow"><span class="arr a">â†’</span><span class="arr b">â†’</span></span></span><span class="fill"></span></a></div>
    <div class="cell"><button class="btn sq" data-strength=".25"><span class="label">View all<span class="arrow"><span class="arr a">â†—</span><span class="arr b">â†—</span></span></span><span class="fill"></span></button></div>
    <div class="cell"><a class="btn round" href="#" style="--fill:#b490ff" data-strength=".5"><span class="label">Menu<span class="arrow"><span class="arr a">+</span><span class="arr b">+</span></span></span><span class="fill"></span></a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine=matchMedia("(pointer:fine)").matches;
  var btns=[].slice.call(document.querySelectorAll(".btn"));
  if(reduce){document.body.classList.add("nomag");return}

  btns.forEach(function(btn){
    var fill=btn.querySelector(".fill"),label=btn.querySelector(".label");
    var a=btn.querySelector(".arr.a"),b=btn.querySelector(".arr.b");
    var s=parseFloat(btn.dataset.strength)||.35;fill.style.transform="none";b.style.transform="none";
    var tl=gsap.timeline({paused:true,defaults:{duration:.5,ease:"power3.inOut"}});
    tl.to(fill,{scale:1,top:"50%",yPercent:-50,xPercent:-50,x:0,y:0,duration:.55},0)
      .to(a,{xPercent:110,yPercent:-110},0)
      .fromTo(b,{xPercent:-110,yPercent:110},{xPercent:0,yPercent:0},0);
    gsap.set(fill,{xPercent:-50,yPercent:0,scale:0,transformOrigin:"50% 50%"});
    // clear CSS transforms conflicting with gsap
    fill.style.transform="";gsap.set(b,{xPercent:-110,yPercent:110});

    var bx=gsap.quickTo(btn,"x",{duration:1,ease:"elastic.out(1,.4)"}),by=gsap.quickTo(btn,"y",{duration:1,ease:"elastic.out(1,.4)"});
    var lx=gsap.quickTo(label,"x",{duration:1,ease:"elastic.out(1,.4)"}),ly=gsap.quickTo(label,"y",{duration:1,ease:"elastic.out(1,.4)"});

    function on(){btn.classList.add("on");tl.timeScale(1).play()}
    function off(){btn.classList.remove("on");tl.timeScale(1.4).reverse()}
    btn.addEventListener("focus",on);btn.addEventListener("blur",off);

    if(!fine)return;
    btn.addEventListener("pointerenter",on);
    btn.addEventListener("pointermove",function(e){
      var r=btn.getBoundingClientRect(),
          ox=e.clientX-(r.left+r.width/2),oy=e.clientY-(r.top+r.height/2);
      bx(ox*s);by(oy*s);lx(ox*s*.5);ly(oy*s*.5);
    });
    btn.addEventListener("pointerleave",function(){bx(0);by(0);lx(0);ly(0);off()});
  });
})();
</script>
</body>
</html>
