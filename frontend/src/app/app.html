<header class="app-header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <svg class="logo__icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#header-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF4B72" />
              <stop offset="100%" stop-color="#7B61FF" />
            </linearGradient>
          </defs>
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
        <span class="logo__text">HealthAI Diagnostics</span>
      </div>

      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
          <span class="nav-icon">🩺</span> Triagem Clínica
        </a>
        <a routerLink="/routes" routerLinkActive="active" class="nav-link nav-link--highlight">
          <span class="nav-icon">🗺️</span> Rotas Médicas (Fase 2)
        </a>
        <a routerLink="/admin" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">⚙️</span> Painel Admin
        </a>
      </nav>
    </div>
  </div>
</header>
<main class="app-main">
  <router-outlet></router-outlet>
</main>
