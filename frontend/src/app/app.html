<header class="app-header">
  <div class="container">
    <div class="header-content">
      <div class="logo">
        <svg class="logo__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
        <div class="logo__brand">
          <span class="logo__text">HealthAI</span>
          <span class="logo__sub">Kit Prontuário · v2.0</span>
        </div>
      </div>

      <nav class="app-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">

        <a routerLink="/admin" routerLinkActive="active" class="nav-link">

        </a>
      </nav>
    </div>
  </div>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
