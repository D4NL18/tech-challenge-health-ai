<div class="login-wrapper">
  <div class="login-card">
    <div class="login-card__header">
      <div class="page-kicker">Acesso Restrito · Governança & Auditoria</div>
      <h1 class="login-card__title">HealthAI Admin</h1>
      <p class="login-card__subtitle">Auditoria de Classificadores e Algoritmos Genéticos</p>
    </div>

    <form class="login-card__form" (submit)="onSubmit($event)">
      <div class="login-card__input-group">
        <label class="login-card__label" for="username">Usuário Administrador</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="login-card__input" 
          [(ngModel)]="username" 
          placeholder="ex: admin" 
          required>
      </div>

      <div class="login-card__input-group">
        <label class="login-card__label" for="password">Senha de Segurança</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="login-card__input" 
          [(ngModel)]="password" 
          placeholder="••••••••" 
          required>
      </div>

      <div class="login-card__error" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="login-card__button" [disabled]="isLoading" [class.btn-loading]="isLoading">
        <span *ngIf="isLoading" class="btn__spinner" aria-hidden="true" style="display:inline-flex;align-items:center;margin-right:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="inline-svg spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        </span>
        <span>{{ isLoading ? 'Autenticando...' : 'Acessar Painel de Modelos' }}</span>
      </button>
    </form>
  </div>
</div>
