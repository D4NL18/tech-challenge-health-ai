name: Supabase keep-alive

# Fase 3 / F0 (passo 0.10, D15): o projeto gratuito do Supabase pausa após 7 dias sem uso.
# Um `SELECT 1` a cada 3 dias mantém o projeto ativo com folga (semanal ficaria no limite exato).
# A URL do banco vem do secret DATABASE_URL (pooler em modo transação, IPv4). Nada de segredo em texto.
# Atenção: o GitHub desativa workflows agendados após 60 dias sem atividade no repositório;
# se isso acontecer, reative em Actions > Supabase keep-alive > Enable workflow.

on:
  schedule:
    - cron: '17 9 */3 * *' # 09:17 UTC nos dias 1, 4, 7, ... de cada mês (intervalo máximo de 3 dias)
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: SELECT 1 no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Executar SELECT 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Secret DATABASE_URL não configurado (ver .agents/docs/tasks/F0-runbook-infra.md)."
            exit 1
          fi

          # O backend usa o formato do SQLAlchemy (postgresql+psycopg://); o psql espera postgresql://.
          PSQL_URL="$(printf '%s' "$DATABASE_URL" | sed -E 's#^postgres(ql)?\+[a-z0-9]+://#postgresql://#')"
          # A máscara do GitHub só cobre o valor exato do secret; o valor derivado precisa da sua.
          echo "::add-mask::$PSQL_URL"

          for attempt in 1 2 3; do
            if psql "$PSQL_URL" -v ON_ERROR_STOP=1 -At -c "SELECT 1;" >/dev/null; then
              echo "Supabase respondeu ao SELECT 1 (tentativa $attempt)."
              exit 0
            fi
            echo "Tentativa $attempt falhou; aguardando 20 s."
            sleep 20
          done

          echo "::error::Supabase não respondeu após 3 tentativas (projeto pausado ou URL inválida)."
          exit 1
