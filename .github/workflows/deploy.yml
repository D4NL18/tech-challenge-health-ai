name: Deploy HealthAI (GCP & Firebase)

on:
  push:
    branches:
      - master # O deploy será acionado automaticamente quando o código for mesclado na branch master
  workflow_dispatch: # Permite disparar o deploy manualmente pela interface do GitHub

jobs:
  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Autenticação no Google Cloud usando Chave de Conta de Serviço (JSON)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # O comando abaixo faz o build da imagem Docker e o deploy automaticamente
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: healthai-diagnostics
          project_id: healthai-diagnostics
          region: us-central1
          source: ./backend
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
          flags: '--allow-unauthenticated --max-instances 2 --memory 2Gi'

  deploy-frontend:
    name: Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Angular App
        working-directory: ./frontend
        run: npm run build

      # Autenticamos no Google Cloud (a mesma credencial serve pro Firebase)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Fazemos o deploy no Firebase Hosting utilizando a CLI oficial
      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        run: npx firebase-tools deploy --only hosting --project healthai-diagnostics
